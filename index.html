<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Rohan Iyer — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --red: #E50914; --red-dark: #b30710;
  --black: #050005; --surface: #0f000f;
  --text: #e5e5e5; --muted: #666;
  --gold: #f5c842;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; }
body { background:var(--black); color:var(--text); font-family:'Outfit',sans-serif; cursor:none; }

/* ── CURSOR ── */
#cursor { position:fixed;width:10px;height:10px;background:var(--red);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(229,9,20,0.9),0 0 20px rgba(229,9,20,0.5); }
#cursor-ring { position:fixed;width:36px;height:36px;border:1.5px solid rgba(229,9,20,0.5);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .25s,height .25s,border-color .25s; }

/* ── SPLASH ── */
#splash { position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column; }
#splash-canvas { position:absolute;inset:0; }
#splash-content { position:relative;z-index:2;text-align:center; }
#splash-wordmark {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4rem,12vw,9rem);
  letter-spacing:0.1em; color:var(--red);
  opacity:0; transform:scale(0.6) translateY(30px);
  animation:splashIn 1s cubic-bezier(.16,1,.3,1) 0.4s forwards;
  text-shadow:0 0 80px rgba(229,9,20,0.6),2px 2px 0 rgba(229,9,20,0.4),4px 4px 0 rgba(229,9,20,0.2);
  position:relative;
}
#splash-wordmark::before,#splash-wordmark::after { content:attr(data-text);position:absolute;top:0;left:0;font-family:'Bebas Neue',sans-serif;font-size:inherit;letter-spacing:inherit;width:100%;pointer-events:none; }
#splash-wordmark::before { color:#ff2020;animation:glitch1 4s infinite;clip-path:polygon(0 0,100% 0,100% 33%,0 33%); }
#splash-wordmark::after  { color:#00e5ff;animation:glitch2 4s infinite;clip-path:polygon(0 66%,100% 66%,100% 100%,0 100%); }
@keyframes glitch1{0%,90%,100%{transform:translate(0)}91%{transform:translate(-3px,1px)}92%{transform:translate(3px,-1px)}93%{transform:translate(0)}}
@keyframes glitch2{0%,87%,100%{transform:translate(0)}88%{transform:translate(3px,2px)}89%{transform:translate(-3px,-2px)}90%{transform:translate(0)}}
#splash-tagline { font-size:.8rem;font-weight:300;letter-spacing:.5em;text-transform:uppercase;color:#333;opacity:0;transform:translateY(12px);animation:fadeUp .6s ease 1.2s forwards; }
#splash-bar { width:100%;max-width:800px;height:2px;background:#111;border-radius:2px;margin-top:2rem;overflow:hidden;opacity:0;animation:fadeUp .4s ease 1.4s forwards; }
#splash-progress { height:100%;width:0;background:linear-gradient(to right,var(--red),#ff6b35);animation:loadBar 1.2s cubic-bezier(.4,0,.2,1) 1.5s forwards;box-shadow:0 0 10px rgba(229,9,20,.8); }
@keyframes splashIn{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes loadBar{to{width:100%}}
#splash.fade-out{animation:splashFade .8s ease forwards}
@keyframes splashFade{to{opacity:0;pointer-events:none}}

/* ── PROFILES ── */
#profiles-screen { display:none;position:fixed;inset:0;z-index:9000;background:var(--black);flex-direction:column;align-items:center; }
#profiles-screen.show { display:flex;animation:fadeInUp .7s ease forwards; }
#profiles-header { width:100%;padding:2rem 3rem; }
.wordmark { font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:.06em;color:var(--red);text-shadow:0 0 30px rgba(229,9,20,.4); }
.profiles-main { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem; }
.profiles-main h2 { font-size:2rem;font-weight:300;color:#fff;margin-bottom:3rem;letter-spacing:.02em; }
.profiles-list { display:flex;gap:3rem;list-style:none; }
.profile-item { display:flex;flex-direction:column;align-items:center;cursor:none;gap:.75rem; }
.profile-avatar { width:120px;height:120px;border-radius:6px;object-fit:cover;border:3px solid transparent;transition:border-color .2s,transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;font-size:4rem;display:flex;align-items:center;justify-content:center;background:#333; }
.profile-item:hover .profile-avatar { border-color:#fff;transform:scale(1.1) perspective(400px) rotateY(-5deg);box-shadow:0 20px 60px rgba(229,9,20,.5); }
.profile-name { color:var(--muted);font-size:.9rem;transition:color .2s;letter-spacing:.05em;font-weight:300; }
.profile-item:hover .profile-name { color:#fff; }
.manage-btn { margin-top:3.5rem;border:1px solid #333;color:#555;background:none;padding:.45rem 1.4rem;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;cursor:none;transition:border-color .2s,color .2s;font-family:'Outfit',sans-serif; }
.manage-btn:hover { border-color:#888;color:#888; }
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── WORLD SCREEN ── */
#world-screen { display:none;position:fixed;inset:0;z-index:5000; }
#world-screen.show { display:block; }
#world-canvas { position:absolute;inset:0;width:100%;height:100%;display:block; }

/* ── HUD ── */
#world-hud { position:absolute;inset:0;pointer-events:none;z-index:10; }
#hud-logo { position:absolute;top:1.5rem;left:2rem;font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--red);letter-spacing:.06em;text-shadow:0 0 20px rgba(229,9,20,.5);pointer-events:all; }
#hud-back { position:absolute;top:1.4rem;right:2rem;background:transparent;border:1px solid rgba(229,9,20,.4);color:rgba(229,9,20,.8);font-family:'Outfit',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem 1rem;border-radius:3px;cursor:none;transition:all .25s;pointer-events:all; }
#hud-back:hover { background:rgba(229,9,20,.15);border-color:var(--red);color:#fff; }
#hud-hint { position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);text-align:center;line-height:1.8; }
#hud-hint span { color:rgba(229,9,20,.7); }
#hud-tooltip { position:absolute;bottom:5rem;left:50%;transform:translateX(-50%);font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.15em;color:#fff;text-shadow:0 0 20px rgba(229,9,20,.6);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center; }
#hud-crosshair { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none; }
#hud-crosshair::before,#hud-crosshair::after { content:'';position:absolute;background:rgba(229,9,20,.5); }
#hud-crosshair::before { width:1px;height:100%;left:50%;top:0; }
#hud-crosshair::after { width:100%;height:1px;top:50%;left:0; }
#hud-cv { position:absolute;bottom:2rem;right:2rem;pointer-events:all; }
#hud-cv a { background:var(--red);color:#fff;font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.4rem 1.1rem;border-radius:3px;text-decoration:none;box-shadow:0 0 20px rgba(229,9,20,.4);transition:all .25s;display:block; }
#hud-cv a:hover { box-shadow:0 0 35px rgba(229,9,20,.7);transform:translateY(-2px); }
#hud-stats { position:absolute;top:1.5rem;left:50%;transform:translateX(-50%);display:flex;gap:2rem;pointer-events:none; }
.hud-stat { text-align:center; }
.hud-stat-n { font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--red);line-height:1;text-shadow:0 0 15px rgba(229,9,20,.5); }
.hud-stat-l { font-size:.55rem;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase; }

/* ── ENTER HINT ── */
#enter-hint { position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:11; }
#enter-hint-inner { text-align:center;animation:enterPulse 2s ease infinite; }
#enter-hint-inner p { font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-top:.5rem; }
@keyframes enterPulse{0%,100%{opacity:.4}50%{opacity:.9}}

/* ── CONTENT OVERLAY ── */
#content-overlay { position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center; }
#content-overlay.active { display:flex; }
#content-bg { position:absolute;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(24px); }
#content-panel {
  position:relative;z-index:1;width:min(940px,95vw);max-height:88vh;
  background:#0d0d0d;border-radius:12px;
  border:1px solid rgba(229,9,20,.35);
  box-shadow:0 0 80px rgba(229,9,20,.15),0 40px 100px rgba(0,0,0,.8);
  display:flex;flex-direction:column;
  animation:panelIn .5s cubic-bezier(.16,1,.3,1);
}
@keyframes panelIn{from{transform:perspective(1000px) rotateX(6deg) translateY(40px) scale(.96);opacity:0}to{transform:perspective(1000px) rotateX(0) translateY(0) scale(1);opacity:1}}
#content-header { display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.8rem;border-bottom:1px solid rgba(229,9,20,.2);flex-shrink:0; }
#content-section-title { font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.1em;color:#fff;text-shadow:0 0 20px rgba(229,9,20,.4); }
#content-close { background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-family:'Outfit',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem 1rem;border-radius:3px;cursor:none;transition:all .25s; }
#content-close:hover { border-color:var(--red);color:#fff;background:rgba(229,9,20,.15); }
#content-body { overflow-y:auto;padding:1.8rem;flex:1; }
#content-body::-webkit-scrollbar { width:4px; }
#content-body::-webkit-scrollbar-track { background:#111; }
#content-body::-webkit-scrollbar-thumb { background:rgba(229,9,20,.4);border-radius:4px; }

/* ── CONTENT INNER STYLES ── */
.c-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1rem; }
.c-grid-2 { display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1rem; }
.c-card { background:#161616;border-radius:8px;padding:1.2rem;border:1px solid #232323;transition:border-color .25s,transform .3s; }
.c-card:hover { border-color:rgba(229,9,20,.4);transform:translateY(-3px); }
.c-card-row { display:flex;gap:1rem;align-items:flex-start; }
.c-card-logo { width:52px;height:52px;background:#252525;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;border:1px solid #2a2a2a;object-fit:contain; }
.c-card-logo img { width:100%;height:100%;object-fit:contain;border-radius:6px; }
.c-card h3 { font-size:.9rem;font-weight:600;color:#fff;margin-bottom:.3rem; }
.c-card .c-meta { font-size:.7rem;color:var(--red);font-weight:600;margin-bottom:.3rem;letter-spacing:.03em; }
.c-card p { font-size:.77rem;color:var(--muted);line-height:1.65;font-weight:300; }
.c-billboard { background:#161616;border-radius:10px;overflow:hidden;border:1px solid rgba(229,9,20,.25);display:grid;grid-template-columns:1fr auto;margin-bottom:1rem;position:relative; }
.c-billboard::before { content:'';position:absolute;inset:-1px;border-radius:10px;background:linear-gradient(135deg,rgba(229,9,20,.2),transparent);opacity:0;transition:opacity .3s;pointer-events:none; }
.c-billboard:hover::before { opacity:1; }
.c-bb-content { padding:1.8rem; }
.c-bb-badge { font-size:.58rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem; }
.c-bb-badge::before { content:'';width:16px;height:1.5px;background:var(--gold); }
.c-bb-title { font-size:1.4rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:.5rem; }
.c-bb-desc { font-size:.78rem;color:var(--muted);line-height:1.7; }
.c-bb-visual { width:100px;background:linear-gradient(135deg,#0d0000,#1a0000);display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative; }
.c-bb-visual::before { content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(229,9,20,.25),transparent 70%); }
.c-skill-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem; }
.c-skill { background:#161616;border-radius:8px;padding:1.1rem;border:1px solid #1f1f1f;transition:border-color .25s; }
.c-skill:hover { border-color:rgba(229,9,20,.3); }
.c-skill h3 { font-size:.78rem;font-weight:700;color:#fff;margin-bottom:.5rem;letter-spacing:.04em;text-transform:uppercase; }
.c-skill p { font-size:.73rem;color:var(--muted);line-height:1.7;font-weight:300; }
.c-info-grid { display:grid;grid-template-columns:1fr 1fr;gap:1rem; }
.c-info-card { background:#161616;border-radius:8px;padding:1.2rem;border:1px solid #1f1f1f; }
.c-info-row { display:flex;gap:.5rem;padding:.45rem 0;border-bottom:1px solid #1a1a1a;font-size:.8rem; }
.c-info-row:last-child { border-bottom:none; }
.c-info-label { color:var(--muted);min-width:75px;flex-shrink:0;font-weight:300; }
.c-info-value { color:var(--text); }
.c-info-value a { color:var(--red);text-decoration:none; }
.c-info-value a:hover { text-decoration:underline; }
.c-cert-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem; }
.c-cert { background:#161616;border-radius:8px;padding:1rem;text-align:center;border:1px solid #1f1f1f;transition:border-color .25s,transform .3s; }
.c-cert:hover { border-color:rgba(229,9,20,.4);transform:translateY(-3px); }
.c-cert-icon { font-size:1.8rem;margin-bottom:.4rem; }
.c-cert h4 { font-size:.75rem;font-weight:600;color:#fff;margin-bottom:.2rem; }
.c-cert p { font-size:.65rem;color:var(--muted); }
.c-award-list { display:flex;flex-direction:column;gap:.6rem; }
.c-award { display:flex;gap:.7rem;background:#161616;border-radius:8px;padding:.9rem 1.1rem;border:1px solid #1f1f1f;transition:border-color .25s,transform .3s; }
.c-award:hover { border-color:rgba(229,9,20,.3);transform:translateX(4px); }
.c-award-dot { color:var(--red);flex-shrink:0;margin-top:.05rem; }
.c-award p { font-size:.8rem;color:var(--muted);line-height:1.6; }
.c-award strong { color:var(--text);font-weight:600; }
.c-tag-row { display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem; }
.c-tag { font-size:.62rem;background:rgba(229,9,20,.08);color:rgba(229,9,20,.85);padding:2px 8px;border-radius:100px;border:1px solid rgba(229,9,20,.2); }
.c-section-label { font-size:.95rem;font-weight:600;color:#fff;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;letter-spacing:.03em; }
.c-section-label::after { content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(229,9,20,.3),transparent); }
.c-hero-content { text-align:center;padding:1.5rem 0; }
.c-hero-name { font-family:'Bebas Neue',sans-serif;font-size:4rem;color:#fff;letter-spacing:.05em;text-shadow:2px 2px 0 rgba(229,9,20,.4),4px 4px 0 rgba(229,9,20,.2); }
.c-hero-name span { color:var(--red); }
.c-hero-sub { font-size:.85rem;color:rgba(229,9,20,.8);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:.4rem 0 1rem; }
.c-hero-desc { font-size:.88rem;color:var(--muted);line-height:1.8;max-width:560px;margin:0 auto 1.5rem; }
.c-hero-btns { display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap; }
.c-btn { display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.5rem;border-radius:4px;font-size:.82rem;font-weight:600;text-decoration:none;border:none;font-family:'Outfit',sans-serif;cursor:none;transition:transform .25s,box-shadow .25s; }
.c-btn:hover { transform:translateY(-3px); }
.c-btn-primary { background:#fff;color:#000; }
.c-btn-primary:hover { box-shadow:0 12px 30px rgba(255,255,255,.2); }
.c-btn-red { background:var(--red);color:#fff; }
.c-btn-red:hover { box-shadow:0 12px 30px rgba(229,9,20,.4); }
.c-stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:1.5rem 0; }
.c-stat { background:#161616;border-radius:8px;padding:1rem;text-align:center;border:1px solid #1f1f1f; }
.c-stat-n { font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--red);text-shadow:0 0 20px rgba(229,9,20,.4); }
.c-stat-l { font-size:.6rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase; }
.c-pub-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem; }
.c-iframe-grid { display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem; }
.c-iframe-wrap { background:#161616;border-radius:8px;overflow:hidden;border:1px solid #1f1f1f; }
.c-iframe-head { display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid #1f1f1f; }
.c-iframe-dot { width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 2s infinite;box-shadow:0 0 6px rgba(229,9,20,.8); }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.c-iframe-label { font-size:.68rem;font-weight:500;color:#aaa;letter-spacing:.04em; }
.c-iframe-wrap iframe { display:block;width:100%;height:340px;border:none; }
@media(max-width:640px){.c-skill-grid{grid-template-columns:1fr}.c-info-grid{grid-template-columns:1fr}.c-stats-row{grid-template-columns:repeat(2,1fr)}.c-iframe-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<!-- ══════ SPLASH ══════ -->
<div id="splash">
  <canvas id="splash-canvas"></canvas>
  <div id="splash-content">
    <div id="splash-wordmark" data-text="ROHAN IYER">ROHAN IYER</div>
    <div id="splash-tagline">Portfolio &amp; Resume · 2026</div>
    <div id="splash-bar"><div id="splash-progress"></div></div>
  </div>
</div>

<!-- ══════ PROFILES ══════ -->
<div id="profiles-screen">
  <header id="profiles-header">
    <div class="wordmark">ROHAN IYER</div>
  </header>
  <main class="profiles-main">
    <h2>Who's watching?</h2>
    <ul class="profiles-list">
      <li>
        <div class="profile-item" onclick="enterWorld()">
          <img src="./profilephoto.png" alt="Rohan" class="profile-avatar"
            onerror="this.outerHTML='<div class=\'profile-avatar\'>🧑‍💻</div>'"/>
          <span class="profile-name">Rohan</span>
        </div>
      </li>
    </ul>
    <button class="manage-btn">MANAGE PROFILES</button>
  </main>
</div>

<!-- ══════ 3D WORLD ══════ -->
<div id="world-screen">
  <canvas id="world-canvas"></canvas>

  <div id="world-hud">
    <div id="hud-logo">ROHAN IYER</div>
    <button id="hud-back" onclick="backToProfiles()">← EXIT</button>
    <div id="hud-stats">
      <div class="hud-stat"><div class="hud-stat-n">9.575</div><div class="hud-stat-l">GPA</div></div>
      <div class="hud-stat"><div class="hud-stat-n">10+</div><div class="hud-stat-l">Projects</div></div>
      <div class="hud-stat"><div class="hud-stat-n">2</div><div class="hud-stat-l">Papers</div></div>
      <div class="hud-stat"><div class="hud-stat-n">4+</div><div class="hud-stat-l">Hackathons</div></div>
    </div>
    <div id="hud-hint">
      <span>DRAG</span> to orbit &nbsp;·&nbsp; <span>WASD</span> to fly &nbsp;·&nbsp; <span>CLICK</span> panel to explore
    </div>
    <div id="hud-tooltip"></div>
    <div id="hud-crosshair"></div>
    <div id="hud-cv"><a href="https://drive.google.com/file/d/1PWbHZNDVtJUMyn4qVDJni3VnzaItRSyj/view?usp=sharing" target="_blank">↓ DOWNLOAD CV</a></div>
  </div>

  <!-- Content Overlay -->
  <div id="content-overlay">
    <div id="content-bg" onclick="closeContent()"></div>
    <div id="content-panel">
      <div id="content-header">
        <div id="content-section-title"></div>
        <button id="content-close" onclick="closeContent()">✕ BACK TO WORLD</button>
      </div>
      <div id="content-body"></div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// CURSOR
// ══════════════════════════════════════════
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mouseX=0,mouseY=0,ringX=0,ringY=0;
document.addEventListener('mousemove',e=>{
  mouseX=e.clientX; mouseY=e.clientY;

})();

// SPLASH THREE.JS  — 3D ROTATING CAGE
// ══════════════════════════════════════════
(function(){
  const canvas=document.getElementById('splash-canvas');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
  camera.position.z=5;

  const mkIco=(r,sub,op)=>{
    const e=new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(r,sub));
    const m=new THREE.LineSegments(e,new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:op}));
    scene.add(m); return m;
  };
  const ico1=mkIco(3,2,.12), ico2=mkIco(1.8,1,.2);
  const torus=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.TorusGeometry(2.5,.04,8,60)),
    new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.1})
  );
  torus.rotation.x=Math.PI/2.5; scene.add(torus);

  const pGeo=new THREE.BufferGeometry();
  const pp=new Float32Array(2400); const pc=new Float32Array(2400);
  for(let i=0;i<800;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=3.5+Math.random()*2.5;
    pp[i*3]=r*Math.sin(ph)*Math.cos(th); pp[i*3+1]=r*Math.sin(ph)*Math.sin(th); pp[i*3+2]=r*Math.cos(ph);
    const b=.5+Math.random()*.5; pc[i*3]=.9*b; pc[i*3+1]=.035*b; pc[i*3+2]=.078*b;
  }
  pGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
  pGeo.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.7}));
  scene.add(pts);

  let f=0;
  const anim=()=>{
    f++; ico1.rotation.x=f*.004; ico1.rotation.y=f*.007;
    ico2.rotation.x=-f*.007; ico2.rotation.y=f*.005;
    torus.rotation.z=f*.003; pts.rotation.y=f*.002;
    renderer.render(scene,camera);
    if(document.getElementById('splash').style.display!=='none') requestAnimationFrame(anim);
  };
  anim();
  window.addEventListener('resize',()=>{
    renderer.setSize(innerWidth,innerHeight);
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  });
})();

// PANEL CANVAS TEXTURE GENERATOR
// ══════════════════════════════════════════
function makePanelTexture(sec) {
  const W=800, H=500;
  const cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');

  // Background
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,350);
  g.addColorStop(0,'#1a0707'); g.addColorStop(1,'#080808');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Scanlines
  ctx.fillStyle='rgba(0,0,0,0.08)';
  for(let y=0;y<H;y+=4) ctx.fillRect(0,y,W,2);

  // Top red bar
  const rg=ctx.createLinearGradient(0,0,W,0);
  rg.addColorStop(0,'#E50914'); rg.addColorStop(.5,'#ff4040'); rg.addColorStop(1,'#E50914');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,5);

  // Bottom glow line
  const bg=ctx.createLinearGradient(0,H-3,W,H-3);
  bg.addColorStop(0,'transparent'); bg.addColorStop(.5,'rgba(229,9,20,.4)'); bg.addColorStop(1,'transparent');
  ctx.fillStyle=bg; ctx.fillRect(0,H-3,W,3);

  // Corner brackets
  ctx.strokeStyle='rgba(229,9,20,0.5)'; ctx.lineWidth=2.5;
  const c=24, l=55;
  [[c,c,l,0,0,l],[W-c,c,-l,0,0,l],[c,H-c,l,0,0,-l],[W-c,H-c,-l,0,0,-l]].forEach(([x,y,dx1,dy1,dx2,dy2])=>{
    ctx.beginPath(); ctx.moveTo(x+dx1,y); ctx.lineTo(x,y); ctx.lineTo(x,y+dy2); ctx.stroke();
  });

  // Icon
  ctx.font='110px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(229,9,20,.6)'; ctx.shadowBlur=30;
  ctx.fillText(sec.icon,W/2,195);
  ctx.shadowBlur=0;

  // Title
  ctx.font='bold 64px "Bebas Neue",Impact,sans-serif';
  ctx.fillStyle='#ffffff'; ctx.textBaseline='top';
  ctx.shadowColor='rgba(229,9,20,.4)'; ctx.shadowBlur=15;
  ctx.fillText(sec.title,W/2,295);
  ctx.shadowBlur=0;

  // Sub
  ctx.font='22px "Outfit",Arial,sans-serif';
  ctx.fillStyle='rgba(150,150,150,.8)';
  ctx.fillText(sec.sub,W/2,370);

  // "CLICK TO EXPLORE" hint
  ctx.font='13px "Outfit",Arial,sans-serif';
  ctx.fillStyle='rgba(229,9,20,.5)';
  ctx.fillText('— CLICK TO EXPLORE —',W/2,430);

  return new THREE.CanvasTexture(cv);
}

let worldRenderer, worldScene, worldCamera;
let panelMeshes=[], glowMeshes=[], labelMeshes=[];
let hoveredPanel=null, focusedPanel=null;
let isFlying=false, flyT=0;
let flyFromPos=new THREE.Vector3(), flyToPos=new THREE.Vector3(), flyFromQuat=new THREE.Quaternion(), flyToQuat=new THREE.Quaternion();
let autoOrbit=true, autoOrbitAngle=0;

let orbitYaw=0, orbitPitch=0.1;

function initWorldThree(){
  const canvas=document.getElementById('world-canvas');
  worldRenderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  worldRenderer.setSize(innerWidth,innerHeight);
  worldRenderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  worldRenderer.setClearColor(0x030008,1);
  worldRenderer.shadowMap.enabled=false;

  worldScene=new THREE.Scene();
  worldScene.fog=new THREE.FogExp2(0x030008,0.022);

  worldCamera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,500);
  worldCamera.position.set(0,1.8,0);
  worldCamera.rotation.order='YXZ';

  buildEnvironment();
  buildPanels();
  buildDecorations();
  bindWorldControls();

  // Intro: camera high up, drops in
  worldCamera.position.set(0,45,5);
  camPos.set(0,45,5);
  isFlying=true; flyT=0;
  flyFromPos.set(0,45,5);
  flyToPos.set(0,1.8,0);
  flyFromQuat.copy(worldCamera.quaternion);
  const tmpCam=worldCamera.clone();
  tmpCam.position.copy(flyToPos);
  tmpCam.rotation.set(0,0,0,'YXZ');
  flyToQuat.copy(tmpCam.quaternion);
  focusedPanel=null;

  animateWorld();
}

function buildEnvironment(){
  // Ambient
  worldScene.add(new THREE.AmbientLight(0x110011,1.5));

  // Red point light above
  const rLight=new THREE.PointLight(0xe50914,3,40);
  rLight.position.set(0,8,0); worldScene.add(rLight);

  // Neon grid floor
  const grid=new THREE.GridHelper(300,150,0xe50914,0x1a0005);
  grid.material.transparent=true; grid.material.opacity=0.35;
  worldScene.add(grid);

  // Floor plane (dark reflective)
  const floorGeo=new THREE.PlaneGeometry(300,300);
  const floorMat=new THREE.MeshBasicMaterial({color:0x030003,transparent:true,opacity:.85});
  const floor=new THREE.Mesh(floorGeo,floorMat);
  floor.rotation.x=-Math.PI/2; floor.position.y=-0.01;
  worldScene.add(floor);

  // Ceiling particle field (stars)
  const starGeo=new THREE.BufferGeometry();
  const starPos=new Float32Array(9000), starCol=new Float32Array(9000);
  for(let i=0;i<3000;i++){
    const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI, r=30+Math.random()*120;
    starPos[i*3]=r*Math.sin(ph)*Math.cos(th);
    starPos[i*3+1]=Math.abs(r*Math.cos(ph))+2;
    starPos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const t=Math.random();
    if(t<.15){ starCol[i*3]=.9;starCol[i*3+1]=.04;starCol[i*3+2]=.06; }
    else if(t<.25){ starCol[i*3]=.8;starCol[i*3+1]=.5;starCol[i*3+2]=.1; }
    else { const b=.3+Math.random()*.7; starCol[i*3]=b;starCol[i*3+1]=b;starCol[i*3+2]=b; }
  }
  starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
  starGeo.setAttribute('color',new THREE.BufferAttribute(starCol,3));
  const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:.12,vertexColors:true,transparent:true,opacity:.7}));
  worldScene.add(stars);

  // Ascending particle streams (red dust)
  const dustGeo=new THREE.BufferGeometry();
  const dustPos=new Float32Array(3000), dustVel=[];
  for(let i=0;i<1000;i++){
    const ang=Math.random()*Math.PI*2, r=3+Math.random()*18;
    dustPos[i*3]=Math.cos(ang)*r; dustPos[i*3+1]=Math.random()*20;
    dustPos[i*3+2]=Math.sin(ang)*r;
    dustVel.push((Math.random()-.5)*.005, .008+Math.random()*.015, (Math.random()-.5)*.005);
  }
  dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
  const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xe50914,size:.06,transparent:true,opacity:.4}));
  worldScene.add(dust);
  worldScene.userData.dust=dust; worldScene.userData.dustVel=dustVel; worldScene.userData.dustPos=dustPos;
}

function buildPanels(){
  SECTIONS.forEach((sec,i)=>{
    const ang=sec.angle*(Math.PI/180);
    const x=Math.sin(ang)*sec.dist, z=-Math.cos(ang)*sec.dist;

    // Panel mesh
    const geo=new THREE.PlaneGeometry(5,3.2);
    const tex=makePanelTexture(sec);
    const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:.92,side:THREE.DoubleSide});
    const panel=new THREE.Mesh(geo,mat);
    panel.position.set(x,sec.h,z);
    panel.lookAt(0,sec.h,0);
    panel.userData={sec,idx:i,baseY:sec.h,floatPhase:Math.random()*Math.PI*2};
    worldScene.add(panel); panelMeshes.push(panel);

    // Panel frame (edge lines)
    const edgeMat=new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.5});
    const edgeGeo=new THREE.EdgesGeometry(geo);
    const frame=new THREE.LineSegments(edgeGeo,edgeMat);
    panel.add(frame);

    // Glow plane (behind panel)
    const glowGeo=new THREE.PlaneGeometry(6.5,4.5);
    const glowMat=new THREE.MeshBasicMaterial({color:0xe50914,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
    const glow=new THREE.Mesh(glowGeo,glowMat);
    glow.position.z=-0.15;
    panel.add(glow); glowMeshes.push(glow);

    // Point light for each panel
    const pLight=new THREE.PointLight(0xe50914,0.8,12);
    pLight.position.set(x,sec.h+1,z*(1+0.1));
    worldScene.add(pLight);
    panel.userData.light=pLight;
  });
}

function buildDecorations(){
  // Giant central torus knot
  const tkGeo=new THREE.TorusKnotGeometry(5,0.08,120,16);
  const tkEdges=new THREE.EdgesGeometry(tkGeo);
  const tk=new THREE.LineSegments(tkEdges,new THREE.LineBasicMaterial({color:0x330008,transparent:true,opacity:.35}));
  tk.position.y=3; worldScene.add(tk); worldScene.userData.tk=tk;

  // Large wireframe icosahedron (outer shell)
  const icoGeo=new THREE.IcosahedronGeometry(18,1);
  const icoEdges=new THREE.EdgesGeometry(icoGeo);
  const ico=new THREE.LineSegments(icoEdges,new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.03}));
  ico.position.y=0; worldScene.add(ico); worldScene.userData.ico=ico;

  // Mid-size icosahedron
  const ico2Geo=new THREE.IcosahedronGeometry(9,1);
  const ico2Edges=new THREE.EdgesGeometry(ico2Geo);
  const ico2=new THREE.LineSegments(ico2Edges,new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.05}));
  ico2.position.y=2; worldScene.add(ico2); worldScene.userData.ico2=ico2;

  // Floating tetrahedra debris
  const debris=[]; worldScene.userData.debris=debris;
  for(let i=0;i<20;i++){
    const s=.2+Math.random()*.7;
    const dGeo=new THREE.TetrahedronGeometry(s,0);
    const dEdges=new THREE.EdgesGeometry(dGeo);
    const d=new THREE.LineSegments(dEdges,new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.08+Math.random()*.2}));
    d.position.set((Math.random()-.5)*35,(Math.random()-.5)*10+2,(Math.random()-.5)*35);
    d.userData={rx:(Math.random()-.5)*.015,ry:(Math.random()-.5)*.02,rz:(Math.random()-.5)*.01,fy:Math.random()*Math.PI*2,fspd:.005+Math.random()*.012,by:d.position.y};
    worldScene.add(d); debris.push(d);
  }

  // Vertical spire rings (like pillars of light)
  for(let i=0;i<8;i++){
    const ang=i*Math.PI/4;
    const rGeo=new THREE.TorusGeometry(.3,.02,6,20);
    const rMat=new THREE.MeshBasicMaterial({color:0xe50914,transparent:true,opacity:.25});
    const ring=new THREE.Mesh(rGeo,rMat);
    ring.position.set(Math.sin(ang)*9,Math.random()*6,Math.cos(ang)*-9);
    ring.rotation.x=Math.PI/2;
    worldScene.add(ring);
  }
}

// ══════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════
function bindWorldControls(){
  const canvas=document.getElementById('world-canvas');

  // Mouse drag for orbit
  canvas.addEventListener('mousedown',e=>{
    if(e.target!==canvas) return;
    isDragging=true; dragLastX=e.clientX; dragLastY=e.clientY;
    autoOrbit=false;
  });
  document.addEventListener('mouseup',()=>{ isDragging=false; });
  document.addEventListener('mousemove',e=>{
    if(!isDragging) return;
    const dx=e.clientX-dragLastX, dy=e.clientY-dragLastY;
    camYaw  -=dx*.003; camPitch-=dy*.002;
    camPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,camPitch));
    dragLastX=e.clientX; dragLastY=e.clientY;
  });

  // Touch drag
  let lastTouchX=0, lastTouchY=0;
  canvas.addEventListener('touchstart',e=>{ lastTouchX=e.touches[0].clientX; lastTouchY=e.touches[0].clientY; autoOrbit=false; });
  canvas.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-lastTouchX, dy=e.touches[0].clientY-lastTouchY;
    camYaw-=dx*.003; camPitch-=dy*.002;
    camPitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,camPitch));
    lastTouchX=e.touches[0].clientX; lastTouchY=e.touches[0].clientY;
  });

  // Keyboard
  document.addEventListener('keydown',e=>{
    if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()]=true;
    if(e.code==='KeyW') keys.w=true;
    if(e.code==='KeyA') keys.a=true;
    if(e.code==='KeyS') keys.s=true;
    if(e.code==='KeyD') keys.d=true;
    if(e.key==='Escape') closeContent();
    if(e.code==='Space'){ autoOrbit=!autoOrbit; }
  });
  document.addEventListener('keyup',e=>{
    if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()]=false;
    if(e.code==='KeyW') keys.w=false;
    if(e.code==='KeyA') keys.a=false;
    if(e.code==='KeyS') keys.s=false;
    if(e.code==='KeyD') keys.d=false;
  });

  // Click - raycast panels
  canvas.addEventListener('click',e=>{
    if(isDragging) return;
    const rect=canvas.getBoundingClientRect();
    const mx=((e.clientX-rect.left)/rect.width)*2-1;
    const my=-((e.clientY-rect.top)/rect.height)*2+1;
    const raycaster=new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(mx,my),worldCamera);
    const hits=raycaster.intersectObjects(panelMeshes);
    if(hits.length){
      flyToPanel(hits[0].object);
    } else {
      // Click empty space — toggle auto orbit
      autoOrbit=!autoOrbit;
    }
  });

  // Hover - raycast
  canvas.addEventListener('mousemove',e=>{
    const rect=canvas.getBoundingClientRect();
    const mx=((e.clientX-rect.left)/rect.width)*2-1;
    const my=-((e.clientY-rect.top)/rect.height)*2+1;
    const raycaster=new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(mx,my),worldCamera);
    const hits=raycaster.intersectObjects(panelMeshes);
    const tooltip=document.getElementById('hud-tooltip');
    if(hits.length){
      hoveredPanel=hits[0].object;
      tooltip.textContent=hoveredPanel.userData.sec.title;
      tooltip.style.opacity='1';
      document.body.style.cursor='none';
    } else {
      hoveredPanel=null;
      tooltip.style.opacity='0';
    }
  });

  window.addEventListener('resize',()=>{
    worldRenderer.setSize(innerWidth,innerHeight);
    worldCamera.aspect=innerWidth/innerHeight;
    worldCamera.updateProjectionMatrix();
  });
}

// ══════════════════════════════════════════
// FLY TO PANEL
// ══════════════════════════════════════════
function flyToPanel(panel){
  if(isFlying) return;
  focusedPanel=panel;
  autoOrbit=false;

  // Target: 5 units in front of panel
  const pPos=panel.position.clone();
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(panel.quaternion);
  const target=pPos.clone().addScaledVector(dir,5.2);
  target.y=Math.max(target.y,1.2);

  flyFromPos.copy(worldCamera.position);
  flyToPos.copy(target);

  const tmpCam=worldCamera.clone();
  tmpCam.position.copy(target);
  tmpCam.lookAt(pPos.x,pPos.y,pPos.z);
  flyToQuat.copy(tmpCam.quaternion);
  flyFromQuat.copy(worldCamera.quaternion);

  flyT=0; isFlying=true;
}

// ══════════════════════════════════════════
// MAIN ANIMATION LOOP
// ══════════════════════════════════════════
const clock=new THREE.Clock();
function animateWorld(){
  requestAnimationFrame(animateWorld);
  const dt=clock.getDelta();
  const t=clock.getElapsedTime();

  // ── Flying camera animation ──
  if(isFlying){
    flyT=Math.min(flyT+dt*0.9,1);
    const eased=flyT<.5? 4*flyT*flyT*flyT : 1-Math.pow(-2*flyT+2,3)/2;
    worldCamera.position.lerpVectors(flyFromPos,flyToPos,eased);
    THREE.Quaternion.slerp(flyFromQuat,flyToQuat,worldCamera.quaternion,eased);
    camPos.copy(worldCamera.position);
    camYaw=Math.atan2(-2*(worldCamera.quaternion.x*worldCamera.quaternion.z-worldCamera.quaternion.w*worldCamera.quaternion.y),
      1-2*(worldCamera.quaternion.y*worldCamera.quaternion.y+worldCamera.quaternion.x*worldCamera.quaternion.x));
    camPitch=Math.asin(2*(worldCamera.quaternion.w*worldCamera.quaternion.x+worldCamera.quaternion.y*worldCamera.quaternion.z));
    if(flyT>=1){
      isFlying=false;
      if(focusedPanel) setTimeout(()=>openContent(focusedPanel.userData.sec),150);
    }
    return;
  }

  // ── Auto orbit ──
  if(autoOrbit){
    autoOrbitAngle+=dt*.12;
    camYaw=autoOrbitAngle;
    camPitch=.06+Math.sin(autoOrbitAngle*.2)*.04;
    camPos.set(0,1.8,0);
  }

  // ── WASD movement ──
  if(!autoOrbit){
    const spd=4*dt;
    const fwd=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw)).multiplyScalar(spd);
    const rgt=new THREE.Vector3(-Math.cos(camYaw),0,Math.sin(camYaw)).multiplyScalar(spd);
    if(keys.w) camPos.add(fwd);
    if(keys.s) camPos.sub(fwd);
    if(keys.a) camPos.add(rgt);
    if(keys.d) camPos.sub(rgt);
    // Clamp to world
    const maxR=22;
    const horiz=Math.sqrt(camPos.x*camPos.x+camPos.z*camPos.z);
    if(horiz>maxR){ camPos.x*=maxR/horiz; camPos.z*=maxR/horiz; }
    camPos.y=Math.max(1.0,Math.min(8,camPos.y));
  }

  // Apply camera
  worldCamera.position.copy(camPos);
  worldCamera.rotation.set(camPitch,camYaw,0,'YXZ');

  // ── Panel animations ──
  panelMeshes.forEach((panel,i)=>{
    const ph=panel.userData.floatPhase;
    panel.position.y=panel.userData.baseY+Math.sin(t*.6+ph)*.18;
    const isHovered=panel===hoveredPanel;
    const targetScale=isHovered?1.07:1;
    panel.scale.lerp(new THREE.Vector3(targetScale,targetScale,targetScale),.08);
    const frame=panel.children[0];
    if(frame&&frame.material){
      frame.material.opacity+=(isHovered?.8:.35-frame.material.opacity)*.12;
    }
    const glow=glowMeshes[i];
    if(glow) glow.material.opacity+=(isHovered?.06:.0-glow.material.opacity)*.1;
    if(panel.userData.light) panel.userData.light.intensity+=((isHovered?2.5:.6)-panel.userData.light.intensity)*.08;
  });

  // ── Decorations ──
  const {tk,ico,ico2,debris,dust,dustVel,dustPos}=worldScene.userData;
  if(tk){ tk.rotation.x=t*.008; tk.rotation.y=t*.012; tk.rotation.z=t*.005; }
  if(ico){ ico.rotation.x=t*.003; ico.rotation.y=t*.005; }
  if(ico2){ ico2.rotation.x=-t*.005; ico2.rotation.y=t*.007; }
  if(debris) debris.forEach(d=>{
    d.rotation.x+=d.userData.rx; d.rotation.y+=d.userData.ry; d.rotation.z+=d.userData.rz;
    d.userData.fy+=d.userData.fspd; d.position.y=d.userData.by+Math.sin(d.userData.fy)*.4;
  });

  // Ascending dust
  if(dust&&dustPos){
    for(let i=0;i<1000;i++){
      dustPos[i*3]+=dustVel[i*3]; dustPos[i*3+1]+=dustVel[i*3+1]; dustPos[i*3+2]+=dustVel[i*3+2];
      if(dustPos[i*3+1]>20){ dustPos[i*3+1]=0; dustPos[i*3]=(Math.random()-.5)*36; dustPos[i*3+2]=(Math.random()-.5)*36; }
    }
    dust.geometry.attributes.position.needsUpdate=true;
  }

  worldRenderer.render(worldScene,worldCamera);
}

// ══════════════════════════════════════════
// CONTENT OVERLAY
// ══════════════════════════════════════════
function openContent(sec){
  document.getElementById('content-section-title').textContent=sec.title;
  document.getElementById('content-body').innerHTML=getContent(sec.id);
  document.getElementById('content-overlay').classList.add('active');
  // Re-init any cursor events inside content
  document.querySelectorAll('#content-body a, #content-body button').forEach(el=>{
    el.addEventListener('mouseenter',()=>{ cursorRing.style.width='55px'; cursorRing.style.height='55px'; cursorRing.style.borderColor='var(--red)'; });
    el.addEventListener('mouseleave',()=>{ cursorRing.style.width='36px'; cursorRing.style.height='36px'; cursorRing.style.borderColor='rgba(229,9,20,.5)'; });
  });
}

function closeContent(){
  const overlay=document.getElementById('content-overlay');
  overlay.classList.remove('active');
  focusedPanel=null;
  // Fly back to center
  if(!isFlying){
    flyFromPos.copy(worldCamera.position);
    flyToPos.set(0,1.8,0);
    const tmpCam=worldCamera.clone();
    tmpCam.position.copy(flyToPos); tmpCam.rotation.set(0,0,0,'YXZ');
    flyToQuat.copy(tmpCam.quaternion); flyFromQuat.copy(worldCamera.quaternion);
    flyT=0; isFlying=true;
    setTimeout(()=>{ autoOrbit=true; },1600);
  }
}

// ══════════════════════════════════════════
// TRANSITIONS
// ══════════════════════════════════════════
function enterWorld(){
  const audio=new Audio('./mixkit-mouse-click-close-1113.mp3');
  audio.play().catch(()=>{});
  const ps=document.getElementById('profiles-screen');
  ps.style.transition='opacity .4s'; ps.style.opacity='0';
  setTimeout(()=>{
    ps.classList.remove('show'); ps.style.display='none';
    const ws=document.getElementById('world-screen');
    ws.classList.add('show');
    initWorldThree();
    autoOrbit=true;
  },400);
}

function backToProfiles(){
  const ws=document.getElementById('world-screen');
  ws.style.transition='opacity .4s'; ws.style.opacity='0';
  setTimeout(()=>{
    ws.classList.remove('show'); ws.style.opacity=''; ws.style.transition='';
    const ps=document.getElementById('profiles-screen');
    ps.style.display=''; ps.style.opacity='0'; ps.classList.add('show');
    setTimeout(()=>{ ps.style.transition='opacity .5s'; ps.style.opacity='1'; },30);
    // Cleanup Three.js
    if(worldRenderer){ worldRenderer.dispose(); worldRenderer=null; }
    panelMeshes=[]; glowMeshes=[];
  },400);
}
