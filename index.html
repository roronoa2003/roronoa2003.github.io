<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Rohan Iyer — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
:root{--red:#E50914;--red2:#ff3d3d;--black:#03000a;--surf:#0d000f;--text:#e5e5e5;--muted:#666;--gold:#f5c842;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;}
body{background:var(--black);color:var(--text);font-family:'Outfit',sans-serif;cursor:none;}
@media(pointer:coarse){body{cursor:auto;}}

/* CURSOR */
#cursor{position:fixed;width:10px;height:10px;background:var(--red);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(229,9,20,.9),0 0 24px rgba(229,9,20,.4);transition:width .2s,height .2s;}
#cursor-ring{position:fixed;width:34px;height:34px;border:1.5px solid rgba(229,9,20,.5);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .28s,height .28s,border-color .28s;}
@media(pointer:coarse){#cursor,#cursor-ring{display:none;}}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;}
#splash-canvas{position:absolute;inset:0;}
#splash-content{position:relative;z-index:2;text-align:center;padding:0 1rem;}
#splash-wordmark{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.2rem,11vw,8.5rem);letter-spacing:.1em;color:var(--red);opacity:0;transform:scale(.6) translateY(30px);animation:splIn 1s cubic-bezier(.16,1,.3,1) .4s forwards;text-shadow:0 0 80px rgba(229,9,20,.6),2px 2px 0 rgba(229,9,20,.4),5px 5px 0 rgba(229,9,20,.15);position:relative;}
#splash-wordmark::before,#splash-wordmark::after{content:attr(data-text);position:absolute;top:0;left:0;font-family:'Bebas Neue',sans-serif;font-size:inherit;letter-spacing:inherit;width:100%;pointer-events:none;}
#splash-wordmark::before{color:#ff2020;animation:gl1 4s infinite;clip-path:polygon(0 0,100% 0,100% 33%,0 33%);}
#splash-wordmark::after{color:#00e5ff;animation:gl2 4s infinite;clip-path:polygon(0 66%,100% 66%,100% 100%,0 100%);}
@keyframes gl1{0%,90%,100%{transform:translate(0)}91%{transform:translate(-3px,1px)}92%{transform:translate(3px,-1px)}93%{transform:translate(0)}}
@keyframes gl2{0%,87%,100%{transform:translate(0)}88%{transform:translate(3px,2px)}89%{transform:translate(-3px,-2px)}90%{transform:translate(0)}}
#splash-sub{font-size:.72rem;font-weight:300;letter-spacing:.45em;text-transform:uppercase;color:#333;opacity:0;transform:translateY(10px);animation:fadeUp .6s ease 1.2s forwards;}
#splash-bar{width:100%;max-width:780px;height:2px;background:#111;border-radius:2px;margin-top:1.8rem;overflow:hidden;opacity:0;animation:fadeUp .4s ease 1.4s forwards;}
#splash-progress{height:100%;width:0;background:linear-gradient(to right,var(--red),#ff6b35);animation:loadBar 1.2s cubic-bezier(.4,0,.2,1) 1.5s forwards;box-shadow:0 0 12px rgba(229,9,20,.8);}
@keyframes splIn{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes loadBar{to{width:100%}}
#splash.fade-out{animation:splFade .8s ease forwards;}
@keyframes splFade{to{opacity:0;pointer-events:none}}

/* PROFILES */
#profiles-screen{display:none;position:fixed;inset:0;z-index:9000;background:var(--black);flex-direction:column;align-items:center;}
#profiles-screen.show{display:flex;animation:fadeInUp .7s ease forwards;}
#profiles-header{width:100%;padding:1.8rem 2.5rem;}
.wordmark{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.06em;color:var(--red);text-shadow:0 0 24px rgba(229,9,20,.4);}
.profiles-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;}
.profiles-main h2{font-size:1.8rem;font-weight:300;color:#fff;margin-bottom:2.5rem;letter-spacing:.02em;}
.profiles-list{display:flex;gap:2.5rem;list-style:none;}
.profile-item{display:flex;flex-direction:column;align-items:center;cursor:none;gap:.7rem;}
@media(pointer:coarse){.profile-item{cursor:pointer;}}
.profile-avatar{width:110px;height:110px;border-radius:8px;object-fit:cover;border:3px solid transparent;transition:border-color .2s,transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;display:flex;align-items:center;justify-content:center;background:#222;font-size:3.5rem;}
.profile-item:hover .profile-avatar{border-color:#fff;transform:scale(1.1) perspective(400px) rotateY(-4deg);box-shadow:0 20px 60px rgba(229,9,20,.5);}
.profile-name{color:var(--muted);font-size:.85rem;transition:color .2s;letter-spacing:.05em;font-weight:300;}
.profile-item:hover .profile-name{color:#fff;}
.manage-btn{margin-top:3rem;border:1px solid #333;color:#555;background:none;padding:.4rem 1.3rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;cursor:none;transition:all .2s;font-family:'Outfit',sans-serif;}
.manage-btn:hover{border-color:#888;color:#888;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* WORLD SCREEN */
#world-screen{display:none;position:fixed;inset:0;z-index:5000;}
#world-screen.show{display:block;}
#world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* LOADING OVERLAY */
#world-loading{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;transition:opacity .8s;}
#world-loading.done{opacity:0;pointer-events:none;}
.load-ring{width:60px;height:60px;border:2px solid #1a0008;border-top:2px solid var(--red);border-radius:50%;animation:spin 1s linear infinite;box-shadow:0 0 20px rgba(229,9,20,.3);}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.2em;color:var(--red);}

/* HUD */
#world-hud{position:absolute;inset:0;pointer-events:none;z-index:10;}
#hud-logo{position:absolute;top:1.2rem;left:1.8rem;font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--red);letter-spacing:.06em;text-shadow:0 0 20px rgba(229,9,20,.5);pointer-events:all;}
#hud-back{position:absolute;top:1.1rem;right:1.8rem;background:transparent;border:1px solid rgba(229,9,20,.35);color:rgba(229,9,20,.75);font-family:'Outfit',sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.32rem .9rem;border-radius:3px;cursor:none;transition:all .25s;pointer-events:all;}
#hud-back:hover{background:rgba(229,9,20,.15);border-color:var(--red);color:#fff;}
@media(pointer:coarse){#hud-back{cursor:pointer;}}
#hud-stats-row{position:absolute;top:1.2rem;left:50%;transform:translateX(-50%);display:flex;gap:1.6rem;pointer-events:none;}
.hs{text-align:center;}
.hs-n{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--red);line-height:1;text-shadow:0 0 12px rgba(229,9,20,.5);}
.hs-l{font-size:.5rem;color:rgba(255,255,255,.3);letter-spacing:.09em;text-transform:uppercase;}
#hud-hint{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.25);text-align:center;white-space:nowrap;}
#hud-hint span{color:rgba(229,9,20,.6);}
#hud-tooltip{position:absolute;bottom:3.8rem;left:50%;transform:translateX(-50%);font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.14em;color:#fff;text-shadow:0 0 18px rgba(229,9,20,.7);opacity:0;transition:opacity .28s;pointer-events:none;white-space:nowrap;}
#hud-cv{position:absolute;bottom:1.4rem;right:1.8rem;pointer-events:all;}
#hud-cv a{background:var(--red);color:#fff;font-family:'Outfit',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:.35rem 1rem;border-radius:3px;text-decoration:none;box-shadow:0 0 18px rgba(229,9,20,.4);transition:all .25s;display:block;}
#hud-cv a:hover{box-shadow:0 0 32px rgba(229,9,20,.75);transform:translateY(-2px);}
#hud-crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:18px;height:18px;pointer-events:none;}
#hud-crosshair::before,#hud-crosshair::after{content:'';position:absolute;background:rgba(229,9,20,.4);}
#hud-crosshair::before{width:1px;height:100%;left:50%;top:0;}
#hud-crosshair::after{width:100%;height:1px;top:50%;left:0;}
@media(max-width:640px){#hud-stats-row{display:none;}#hud-hint{display:none;}#hud-crosshair{display:none;}}

/* MOBILE SECTIONS BUTTON */
#mob-sections-btn{display:none;position:absolute;bottom:1.4rem;left:1.8rem;background:rgba(229,9,20,.15);border:1px solid rgba(229,9,20,.4);color:rgba(229,9,20,.9);font-family:'Outfit',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.35rem 1rem;border-radius:3px;pointer-events:all;cursor:pointer;}
@media(pointer:coarse){#mob-sections-btn{display:block;}}
#mob-menu{display:none;position:absolute;inset:0;z-index:55;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;padding:2rem;}
#mob-menu.open{display:flex;}
#mob-menu-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.15em;color:var(--red);margin-bottom:.5rem;}
#mob-menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;width:100%;max-width:480px;}
.mob-sec-btn{background:#111;border:1px solid #222;border-radius:8px;padding:.9rem .5rem;text-align:center;cursor:pointer;transition:all .25s;-webkit-tap-highlight-color:transparent;}
.mob-sec-btn:active{background:#1a0005;border-color:var(--red);}
.mob-sec-btn .msb-icon{font-size:1.5rem;margin-bottom:.25rem;}
.mob-sec-btn .msb-label{font-size:.55rem;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;line-height:1.3;}
#mob-menu-close{background:transparent;border:1px solid #333;color:#666;font-family:'Outfit',sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:.35rem 1.2rem;border-radius:3px;cursor:pointer;margin-top:.5rem;}

/* VIRTUAL JOYSTICK */
#joystick-zone{display:none;position:absolute;bottom:5rem;left:1.8rem;width:100px;height:100px;pointer-events:all;z-index:20;}
@media(pointer:coarse){#joystick-zone{display:block;}}
#joystick-base{width:90px;height:90px;border-radius:50%;border:2px solid rgba(229,9,20,.25);background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
#joystick-thumb{width:36px;height:36px;border-radius:50%;background:rgba(229,9,20,.4);border:1.5px solid rgba(229,9,20,.7);transition:transform .05s;will-change:transform;}

/* CONTENT OVERLAY */
#content-overlay{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:1rem;}
#content-overlay.active{display:flex;}
#content-bg{position:absolute;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(24px);}
#content-panel{position:relative;z-index:1;width:min(960px,100%);max-height:88vh;background:linear-gradient(135deg,#0d0d0d,#0a0005);border-radius:12px;border:1px solid rgba(229,9,20,.3);box-shadow:0 0 80px rgba(229,9,20,.12),0 40px 100px rgba(0,0,0,.8);display:flex;flex-direction:column;animation:panIn .5s cubic-bezier(.16,1,.3,1);}
@keyframes panIn{from{transform:perspective(900px) rotateX(6deg) translateY(36px) scale(.96);opacity:0}to{transform:perspective(900px) rotateX(0) translateY(0) scale(1);opacity:1}}
#content-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid rgba(229,9,20,.18);flex-shrink:0;gap:1rem;}
#content-section-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.1em;color:#fff;text-shadow:0 0 18px rgba(229,9,20,.4);white-space:nowrap;}
#content-close{background:transparent;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.55);font-family:'Outfit',sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;padding:.3rem .9rem;border-radius:3px;cursor:none;transition:all .22s;white-space:nowrap;flex-shrink:0;}
#content-close:hover{border-color:var(--red);color:#fff;background:rgba(229,9,20,.15);}
@media(pointer:coarse){#content-close{cursor:pointer;}}
#content-body{overflow-y:auto;padding:1.4rem;flex:1;overscroll-behavior:contain;}
#content-body::-webkit-scrollbar{width:3px;}
#content-body::-webkit-scrollbar-track{background:transparent;}
#content-body::-webkit-scrollbar-thumb{background:rgba(229,9,20,.35);border-radius:3px;}

/* ── CONTENT INNER STYLES ── */
.c-hero{text-align:center;padding:1rem 0;}
.c-hero-photo{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--red);box-shadow:0 0 30px rgba(229,9,20,.5);margin:0 auto 1rem;}
.c-hero-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,8vw,3.8rem);color:#fff;letter-spacing:.05em;text-shadow:2px 2px 0 rgba(229,9,20,.35),4px 4px 0 rgba(229,9,20,.15);}
.c-hero-name span{color:var(--red);}
.c-hero-title{font-size:.75rem;color:rgba(229,9,20,.75);font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:.4rem 0 .8rem;}
.c-hero-desc{font-size:.83rem;color:var(--muted);line-height:1.8;max-width:520px;margin:0 auto 1.5rem;font-weight:300;}
.c-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:1rem 0;}
.c-stat{background:#111;border-radius:8px;padding:.9rem .5rem;text-align:center;border:1px solid #1a1a1a;}
.c-stat-n{font-family:'Bebas Neue',sans-serif;font-size:1.9rem;color:var(--red);text-shadow:0 0 16px rgba(229,9,20,.4);line-height:1;}
.c-stat-l{font-size:.55rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:.2rem;}
.c-btns{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;}
.c-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.4rem;border-radius:4px;font-size:.78rem;font-weight:600;text-decoration:none;border:none;font-family:'Outfit',sans-serif;cursor:none;transition:transform .22s,box-shadow .22s;}
.c-btn:hover{transform:translateY(-2px);}
@media(pointer:coarse){.c-btn{cursor:pointer;}}
.c-btn-w{background:#fff;color:#000;}
.c-btn-w:hover{box-shadow:0 10px 28px rgba(255,255,255,.2);}
.c-btn-r{background:var(--red);color:#fff;}
.c-btn-r:hover{box-shadow:0 10px 28px rgba(229,9,20,.4);}
.c-btn-g{background:#111;color:#fff;border:1px solid #333;}
.c-btn-g:hover{border-color:var(--red);}
.c-lbl{font-size:.88rem;font-weight:600;color:#fff;margin-bottom:.8rem;display:flex;align-items:center;gap:.6rem;letter-spacing:.03em;}
.c-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(229,9,20,.25),transparent);}
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.85rem;margin-bottom:.85rem;}
.c-grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:.85rem;}
.c-card{background:#111;border-radius:8px;padding:1.1rem;border:1px solid #1f1f1f;transition:border-color .22s,transform .28s;position:relative;overflow:hidden;}
.c-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,var(--red),transparent);transform:scaleX(0);transform-origin:left;transition:transform .3s;}
.c-card:hover{border-color:rgba(229,9,20,.35);transform:translateY(-3px);}
.c-card:hover::before{transform:scaleX(1);}
.c-card-row{display:flex;gap:.9rem;align-items:flex-start;}
.c-logo{width:48px;height:48px;border-radius:6px;background:#1a1a1a;border:1px solid #252525;object-fit:contain;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
.c-logo img{width:100%;height:100%;object-fit:contain;border-radius:5px;}
.c-card h3{font-size:.86rem;font-weight:600;color:#fff;margin-bottom:.28rem;line-height:1.3;}
.c-meta{font-size:.67rem;color:var(--red);font-weight:700;margin-bottom:.28rem;letter-spacing:.03em;}
.c-card p{font-size:.73rem;color:var(--muted);line-height:1.65;font-weight:300;}
.c-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.55rem;}
.c-tag{font-size:.6rem;background:rgba(229,9,20,.07);color:rgba(229,9,20,.8);padding:2px 7px;border-radius:100px;border:1px solid rgba(229,9,20,.18);}
.c-skills{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
.c-sk{background:#111;border-radius:8px;padding:1rem;border:1px solid #1f1f1f;transition:all .25s;}
.c-sk:hover{border-color:rgba(229,9,20,.3);transform:translateY(-2px);}
.c-sk h3{font-size:.72rem;font-weight:700;color:#fff;margin-bottom:.45rem;letter-spacing:.05em;text-transform:uppercase;}
.c-sk p{font-size:.7rem;color:var(--muted);line-height:1.7;font-weight:300;}
.c-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
.c-icard{background:#111;border-radius:8px;padding:1.1rem;border:1px solid #1f1f1f;}
.c-icard h4{font-size:.75rem;font-weight:700;color:#fff;margin-bottom:.7rem;letter-spacing:.03em;}
.c-row{display:flex;gap:.5rem;padding:.42rem 0;border-bottom:1px solid #181818;font-size:.77rem;}
.c-row:last-child{border-bottom:none;}
.c-rl{color:var(--muted);min-width:72px;flex-shrink:0;font-weight:300;}
.c-rv{color:var(--text);}
.c-rv a{color:var(--red);text-decoration:none;}
.c-rv a:hover{text-decoration:underline;}
.c-bb{background:#111;border-radius:10px;overflow:hidden;border:1px solid rgba(229,9,20,.2);display:grid;grid-template-columns:1fr 80px;margin-bottom:.85rem;transition:border-color .25s;}
.c-bb:hover{border-color:rgba(229,9,20,.4);}
.c-bb-c{padding:1.4rem;}
.c-bb-badge{font-size:.58rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.35rem;margin-bottom:.45rem;}
.c-bb-badge::before{content:'';width:14px;height:1.5px;background:var(--gold);}
.c-bb-t{font-size:1.2rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:.4rem;}
.c-bb-d{font-size:.73rem;color:var(--muted);line-height:1.65;}
.c-bb-v{background:linear-gradient(135deg,#0d0000,#1a0000);display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative;}
.c-bb-v::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(229,9,20,.2),transparent 70%);}
.c-certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;}
.c-cert{background:#111;border-radius:8px;padding:.9rem;text-align:center;border:1px solid #1f1f1f;transition:all .25s;}
.c-cert:hover{border-color:rgba(229,9,20,.4);transform:translateY(-3px);}
.c-cert-icon{font-size:1.7rem;margin-bottom:.35rem;}
.c-cert h4{font-size:.72rem;font-weight:600;color:#fff;margin-bottom:.2rem;line-height:1.3;}
.c-cert p{font-size:.62rem;color:var(--muted);}
.c-award-list{display:flex;flex-direction:column;gap:.55rem;}
.c-award{display:flex;gap:.65rem;background:#111;border-radius:8px;padding:.85rem 1rem;border:1px solid #1f1f1f;transition:all .22s;}
.c-award:hover{border-color:rgba(229,9,20,.3);transform:translateX(3px);}
.c-award-dot{color:var(--red);flex-shrink:0;font-size:.9rem;}
.c-award p{font-size:.77rem;color:var(--muted);line-height:1.6;}
.c-award strong{color:var(--text);}
.c-iframe-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.8rem;}
.c-iframe-wrap{background:#111;border-radius:8px;overflow:hidden;border:1px solid #1f1f1f;}
.c-iframe-head{display:flex;align-items:center;gap:.45rem;padding:.65rem .9rem;border-bottom:1px solid #1a1a1a;}
.c-iframe-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 2s infinite;box-shadow:0 0 6px rgba(229,9,20,.8);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.c-iframe-lbl{font-size:.65rem;color:#888;letter-spacing:.04em;}
.c-iframe-wrap iframe{display:block;width:100%;height:300px;border:none;}
.c-reel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;}
.c-reel{background:#111;border-radius:8px;overflow:hidden;border:1px solid #1f1f1f;}
.c-reel-head{display:flex;align-items:center;gap:.4rem;padding:.6rem .85rem;border-bottom:1px solid #1a1a1a;}

const $cursor = document.getElementById('cursor');
const $ring   = document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  $cursor.style.left=mx+'px';$cursor.style.top=my+'px';
});
(function tickRing(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;$ring.style.left=rx+'px';$ring.style.top=ry+'px';requestAnimationFrame(tickRing);})();
function hoverCursor(on){$ring.style.width=on?'55px':'34px';$ring.style.height=on?'55px':'34px';$ring.style.borderColor=on?'var(--red)':'rgba(229,9,20,.5)';}

// SPLASH THREE.JS
// ══════════════════════════════════════════════════════
(function(){
  const cv=document.getElementById('splash-canvas');
  const R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
  const sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
  cam.position.z=5;
  const mkIco=(r,d,op)=>{const m=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(r,d)),new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:op}));sc.add(m);return m;};
  const i1=mkIco(3,2,.1),i2=mkIco(1.6,1,.18);
  const torus=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.TorusGeometry(2.2,.04,8,55)),new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.09}));
  torus.rotation.x=Math.PI/2.5;sc.add(torus);
  const pG=new THREE.BufferGeometry(),pp=new Float32Array(2400),pc=new Float32Array(2400);
  for(let i=0;i<800;i++){const t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1),r=3.5+Math.random()*2.5;pp[i*3]=r*Math.sin(p)*Math.cos(t);pp[i*3+1]=r*Math.sin(p)*Math.sin(t);pp[i*3+2]=r*Math.cos(p);const b=.5+Math.random()*.5;pc[i*3]=.9*b;pc[i*3+1]=.035*b;pc[i*3+2]=.08*b;}
  pG.setAttribute('position',new THREE.BufferAttribute(pp,3));pG.setAttribute('color',new THREE.BufferAttribute(pc,3));
  const pts=new THREE.Points(pG,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.7}));sc.add(pts);
  let f=0;const anim=()=>{f++;i1.rotation.x=f*.004;i1.rotation.y=f*.007;i2.rotation.x=-f*.007;i2.rotation.y=f*.005;torus.rotation.z=f*.003;pts.rotation.y=f*.002;R.render(sc,cam);if(document.getElementById('splash').style.display!=='none')requestAnimationFrame(anim);};anim();
  window.addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
})();

window.addEventListener('load',()=>{
  setTimeout(()=>{const sp=document.getElementById('splash');sp.classList.add('fade-out');sp.addEventListener('animationend',()=>{sp.style.display='none';document.getElementById('profiles-screen').classList.add('show');},{once:true});},2800);
});

function makePanelTex(sec){
  const W=1536,H=960,cv=document.createElement('canvas');
  cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  // Background
  const g=ctx.createRadialGradient(W/2,H*.38,0,W/2,H*.38,700);
  g.addColorStop(0,'#240810');g.addColorStop(1,'#060307');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Subtle scanlines
  ctx.fillStyle='rgba(0,0,0,.05)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,2);
  // Top accent bar
  const tg=ctx.createLinearGradient(0,0,W,0);
  tg.addColorStop(0,'#c40010');tg.addColorStop(.5,'#ff3333');tg.addColorStop(1,'#c40010');
  ctx.fillStyle=tg;ctx.fillRect(0,0,W,8);
  // Bottom glow line
  const bg2=ctx.createLinearGradient(0,H-4,W,H-4);
  bg2.addColorStop(0,'transparent');bg2.addColorStop(.5,'rgba(229,9,20,.35)');bg2.addColorStop(1,'transparent');
  ctx.fillStyle=bg2;ctx.fillRect(0,H-4,W,4);
  // Corner brackets
  ctx.strokeStyle='rgba(229,9,20,.55)';ctx.lineWidth=3.5;
  [[36,36,80],[W-36,36,-80],[36,H-36,80],[W-36,H-36,-80]].forEach(([x,y,d])=>{
    ctx.beginPath();ctx.moveTo(x+d,y);ctx.lineTo(x,y);ctx.lineTo(x,y+d);ctx.stroke();
  });
  // Helper — draw text with layered white outer glow then fill
  function glowText(text,x,y,font,fillCol,glowRadius,glowPasses){
    ctx.save();
    ctx.font=font;ctx.textAlign='center';ctx.textBaseline='top';
    // Build up glow in multiple passes at decreasing opacity for smooth halo
    for(let p=glowPasses;p>0;p--){
      ctx.shadowColor='rgba(255,255,255,'+(0.08+(glowPasses-p)*0.03)+')';
      ctx.shadowBlur=glowRadius*(p/glowPasses);
      ctx.fillStyle='rgba(255,255,255,0)'; // transparent fill — only shadow counts
      ctx.fillText(text,x,y);
    }
    // Final crisp fill on top
    ctx.shadowColor='rgba(255,255,255,.55)';
    ctx.shadowBlur=glowRadius*.35;
    ctx.fillStyle=fillCol;
    ctx.fillText(text,x,y);
    ctx.shadowBlur=0;ctx.restore();
  }

  // Icon — white glow halo around emoji
  ctx.save();
  ctx.font='200px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(255,255,255,.45)';ctx.shadowBlur=60;
  ctx.fillStyle='#fff';ctx.fillText(sec.icon,W/2,H*.36);
  ctx.shadowBlur=0;ctx.restore();

  // Section title — large white glow outer bloom
  glowText(sec.title,W/2,H*.57,'bold 128px "Bebas Neue",Impact,sans-serif','#ffffff',80,6);

  // Subtitle — softer white glow
  glowText(sec.sub,W/2,H*.755,'500 38px "Outfit",Arial,sans-serif','rgba(230,230,230,.95)',40,4);

  // CTA hint — red tint with white glow
  ctx.save();
  ctx.font='300 26px "Outfit",Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.shadowColor='rgba(255,255,255,.4)';ctx.shadowBlur=18;
  ctx.fillStyle='rgba(255,120,120,.9)';
  ctx.fillText('— CLICK TO EXPLORE —',W/2,H*.875);
  ctx.shadowBlur=0;ctx.restore();
  return new THREE.CanvasTexture(cv);
}

function buildFloor(){
  // ── Rocky exoplanet terrain — layered PBR (Poly Haven CC0) ──
  // Primary: rock_ground_rough — natural ground-level rocky surface
  // Fallback: aerial_rocks_02 — mossy cracked rock (confirmed working)
  const PRIM_DIFF ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rock_ground_rough/rock_ground_rough_diff_2k.jpg';
  const PRIM_NOR  ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rock_ground_rough/rock_ground_rough_nor_gl_2k.jpg';
  const PRIM_ROUGH='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rock_ground_rough/rock_ground_rough_rough_2k.jpg';
  const FALL_DIFF ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/aerial_rocks_02/aerial_rocks_02_diff_2k.jpg';
  const FALL_NOR  ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/aerial_rocks_02/aerial_rocks_02_nor_gl_2k.jpg';
  const FALL_ROUGH='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/aerial_rocks_02/aerial_rocks_02_rough_2k.jpg';

  const segs=isMobile?100:200;
  const geo=new THREE.PlaneGeometry(260,260,segs,segs);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    const r=Math.sqrt(x*x+z*z);
    let h=0;
    // Large undulation layers
    h+=Math.sin(x*.10)*Math.cos(z*.09)*1.4;
    h+=Math.sin(x*.23+z*.17)*Math.cos(z*.28-x*.08)*.75;
    h+=Math.sin(x*.51+1.3)*Math.cos(z*.47+.7)*.35;
    // Medium rock pockmarks
    h+=Math.sin(x*1.1+z*1.3)*.16;
    h+=Math.sin(x*2.2-z*1.9)*.07;
    // Fine surface roughness
    h+=(Math.random()-.5)*.22;
    // Keep centre (camera area) flat
    const flat=Math.min(1,Math.max(0,(r-8)/10));
    h*=flat;
    // Rim ridges rising at distance
    if(r>20)h+=Math.abs(Math.sin(x*.16)*Math.cos(z*.19))*3.0*Math.min(1,(r-20)/14);
    pos.setY(i,h-.02);
  }
  geo.computeVertexNormals();

  // Dark alien tint — will be multiplied on top of the real rock diffuse
  const terrMat=new THREE.MeshStandardMaterial({color:0x2a0809,roughness:.96,metalness:.03});
  WS.add(new THREE.Mesh(geo,terrMat));

  // Load PBR maps — try primary first; fall back gracefully
  const txLoader=new THREE.TextureLoader();
  // Finer tiling (28×) = visibly sharper surface at walk distance
  function tile(t,rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep||28,rep||28);t.anisotropy=Math.min(16,WR.capabilities.getMaxAnisotropy());return t;}
  // Strong normal scale = much more surface depth & rock bumps
  const NRM_SCALE=1.6;
  function loadSet(diff,nor,rough){
    txLoader.load(diff, t=>{terrMat.map=tile(t,28);terrMat.needsUpdate=true;},undefined,()=>{});
    txLoader.load(nor,  t=>{terrMat.normalMap=tile(t,28);terrMat.normalScale.set(NRM_SCALE,NRM_SCALE);terrMat.needsUpdate=true;},undefined,()=>{});
    txLoader.load(rough,t=>{terrMat.roughnessMap=tile(t,28);terrMat.needsUpdate=true;},undefined,()=>{});
  }
  // Attempt primary; if diff fails, switch to confirmed fallback
  txLoader.load(PRIM_DIFF,
    t=>{terrMat.map=tile(t,28);terrMat.needsUpdate=true;loadSet(PRIM_DIFF,PRIM_NOR,PRIM_ROUGH);},
    undefined,
    ()=>{loadSet(FALL_DIFF,FALL_NOR,FALL_ROUGH);}
  );


  // ── Glowing lava fissures ────────────────────────────
  const fPts=[];
  for(let i=0;i<55;i++){
    const a=Math.random()*Math.PI*2,r1=9+Math.random()*35,r2=r1+1.5+Math.random()*7;
    const jitter=()=>(Math.random()-.5)*2.5;
    fPts.push(Math.sin(a)*r1+jitter(),.05,Math.cos(a)*r1+jitter());
    fPts.push(Math.sin(a)*r2+jitter(),.05,Math.cos(a)*r2+jitter());
  }
  const fGeo=new THREE.BufferGeometry();
  fGeo.setAttribute('position',new THREE.Float32BufferAttribute(fPts,3));
  const fissure1=new THREE.LineSegments(fGeo,new THREE.LineBasicMaterial({color:0xff2008,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));
  WS.add(fissure1);

  // ── Secondary fissure layer ───────────────────────────
  const f2Pts=[];
  for(let i=0;i<35;i++){
    const a=Math.random()*Math.PI*2+.3,r1=6+Math.random()*20,r2=r1+.8+Math.random()*5;
    f2Pts.push(Math.sin(a)*r1,.04,Math.cos(a)*r1,Math.sin(a)*r2,.04,Math.cos(a)*r2);
  }
  const f2Geo=new THREE.BufferGeometry();
  f2Geo.setAttribute('position',new THREE.Float32BufferAttribute(f2Pts,3));
  const fissure2=new THREE.LineSegments(f2Geo,new THREE.LineBasicMaterial({color:0xff6030,transparent:true,opacity:.10,blending:THREE.AdditiveBlending,depthWrite:false}));
  WS.add(fissure2);
  WS.userData.fissures=[fissure1,fissure2];
}

function buildStars(){
  // ── NASA real Milky Way equirectangular sky sphere ──
  const skyGeo=new THREE.SphereGeometry(280,48,24);
  // color acts as a brightness multiplier on the texture: 0x333333 = ~20% brightness = very dark night sky
  const skyMat=new THREE.MeshBasicMaterial({color:0x333333,side:THREE.BackSide,depthWrite:false,fog:false});
  const skySphere=new THREE.Mesh(skyGeo,skyMat);
  WS.add(skySphere);WS.userData.skySphere=skySphere;

  function buildCanvasGalaxy(){
    // Procedural fallback – deep space with colour-varied stars + milky band
    const W=2048,H=1024;
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#000005';ctx.fillRect(0,0,W,H);
    // Milky way diffuse band — brighter since sky multiplier is dark
    const band=ctx.createLinearGradient(0,260,0,H-260);
    band.addColorStop(0,'rgba(0,0,0,0)');band.addColorStop(.35,'rgba(180,120,70,.18)');
    band.addColorStop(.5,'rgba(255,160,80,.25)');band.addColorStop(.65,'rgba(180,120,70,.18)');band.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=band;ctx.fillRect(0,0,W,H);
    // Stars — brighter since multiplier dims them
    for(let i=0;i<16000;i++){
      const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.8+.15;
      const v=Math.random();
      let col;
      if(v<.08)col=`rgba(255,140,120,${.85+Math.random()*.15})`;
      else if(v<.16)col=`rgba(180,200,255,${.85+Math.random()*.15})`;
      else if(v<.22)col=`rgba(255,235,150,${.75+Math.random()*.25})`;
      else col=`rgba(255,255,255,${.55+Math.random()*.45})`;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    }
    // Nebula glows
    [[400,350,200,200,'rgba(200,30,60,.18)'],[1200,500,260,160,'rgba(30,60,200,.14)'],[1700,300,180,140,'rgba(120,15,80,.14)'],[900,700,150,120,'rgba(80,180,255,.08)']].forEach(([cx,cy,rx,ry,col])=>{
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
      g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.fill();
    });
    return new THREE.CanvasTexture(c);
  }

  const txLoader=new THREE.TextureLoader();
  txLoader.crossOrigin='anonymous';
  txLoader.load(
    'https://svs.gsfc.nasa.gov/vis/a000000/a004800/a004851/starmap_2020_4k_print.jpg',
    t=>{skyMat.map=t;skyMat.needsUpdate=true;},
    undefined,
    ()=>{skyMat.map=buildCanvasGalaxy();skyMat.needsUpdate=true;}
  );
}


function buildDust(){
  const cnt=isMobile?500:1000;
  const dG=new THREE.BufferGeometry(),dp=new Float32Array(cnt*3),dv=[];
  for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2,r=4+Math.random()*20;dp[i*3]=Math.cos(a)*r;dp[i*3+1]=Math.random()*18;dp[i*3+2]=Math.sin(a)*r;dv.push((Math.random()-.5)*.004,.007+Math.random()*.014,(Math.random()-.5)*.004);}
  dG.setAttribute('position',new THREE.BufferAttribute(dp,3));
  const dustPts=new THREE.Points(dG,new THREE.PointsMaterial({color:0xe50914,size:.06,transparent:true,opacity:.35}));
  WS.add(dustPts);WS.userData.dustPts=dustPts;WS.userData.dustVel=dv;WS.userData.dustPos=dp;WS.userData.dustCnt=cnt;
}

function buildPanels(){
  SECTIONS.forEach((sec,i)=>{
    const ang=sec.angle*Math.PI/180;
    const x=Math.sin(ang)*sec.dist,z=-Math.cos(ang)*sec.dist;
    const geo=new THREE.PlaneGeometry(6,3.8);
    const panel=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:makePanelTex(sec),transparent:true,opacity:.94,side:THREE.DoubleSide,roughness:.8,metalness:.1}));
    panel.position.set(x,sec.h,z);panel.lookAt(0,sec.h,0);panel.rotateY(Math.PI);
    panel.userData={sec,idx:i,baseY:sec.h,fp:Math.random()*Math.PI*2};

    const frame=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.4}));

    const pl=new THREE.PointLight(0xe50914,.7,14);pl.position.set(x,sec.h,z*.95);WS.add(pl);panelLights.push(pl);
  });
}

function buildDecorations(){
  // ── Shared PBR texture loader ──────────────────────────────────────────
  const txLoader=new THREE.TextureLoader();
  // metal_plate: dark industrial diamond plate (Poly Haven CC0)
  const MP_DIFF ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/metal_plate/metal_plate_diff_2k.jpg';
  const MP_NOR  ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/metal_plate/metal_plate_nor_gl_2k.jpg';
  const MP_ROUGH='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/metal_plate/metal_plate_rough_2k.jpg';
  // rock_surface for floating debris
  const RK_DIFF ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rock_surface/rock_surface_diff_2k.jpg';
  const RK_NOR  ='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rock_surface/rock_surface_nor_gl_2k.jpg';
  const RK_ROUGH='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/rock_surface/rock_surface_rough_2k.jpg';

  // Helper: load a set of PBR maps into a material
  function applyPBR(mat,diff,nor,rough,repeat){
    const r=repeat||1;
    function tile(t){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(r,r);return t;}
    txLoader.load(diff, t=>{mat.map=tile(t);mat.needsUpdate=true;},undefined,()=>{});
    txLoader.load(nor,  t=>{mat.normalMap=tile(t);mat.normalScale.set(.8,.8);mat.needsUpdate=true;},undefined,()=>{});
    txLoader.load(rough,t=>{mat.roughnessMap=tile(t);mat.needsUpdate=true;},undefined,()=>{});
  }

  // ── Torus knot — solid metal centerpiece ───────────────────────────────
  const tkMat=new THREE.MeshStandardMaterial({color:0xcc3322,emissive:0x1a0008,emissiveIntensity:.25,roughness:.35,metalness:.85});
  applyPBR(tkMat,MP_DIFF,MP_NOR,MP_ROUGH,3);
  const tk=new THREE.Mesh(new THREE.TorusKnotGeometry(4.5,.12,160,18),tkMat);
  tk.position.y=3.5;WS.add(tk);WS.userData.tk=tk;

  // ── Translucent icosahedron shells (keep as thin wireframe atmosphere) ─
  const icoOuter=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(17,1)),new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.02}));
  WS.add(icoOuter);WS.userData.icoOuter=icoOuter;
  const icoInner=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(8,1)),new THREE.LineBasicMaterial({color:0xe50914,transparent:true,opacity:.04}));
  icoInner.position.y=2;WS.add(icoInner);WS.userData.icoInner=icoInner;

  // ── Floating rock debris — solid PBR ───────────────────────────────────
  const debris=[];
  const debrisCnt=isMobile?10:20;
  // Shared rock material (one material, multiple meshes for perf)
  const rkMat=new THREE.MeshStandardMaterial({color:0x5a1a10,roughness:.92,metalness:.05});
  applyPBR(rkMat,RK_DIFF,RK_NOR,RK_ROUGH,1);
  for(let i=0;i<debrisCnt;i++){
    const s=.18+Math.random()*.55;
    // Alternate between tetra and dodecahedron for variety
    const geo=i%3===0?new THREE.DodecahedronGeometry(s,0):new THREE.TetrahedronGeometry(s,0);
    const d=new THREE.Mesh(geo,rkMat);
    d.position.set((Math.random()-.5)*32,(Math.random()-.5)*9+2,(Math.random()-.5)*32);
    d.userData={rx:(Math.random()-.5)*.013,ry:(Math.random()-.5)*.018,rz:(Math.random()-.5)*.01,fy:Math.random()*Math.PI*2,fs:.005+Math.random()*.011,by:d.position.y};
    WS.add(d);debris.push(d);
  }
  WS.userData.debris=debris;

  // ── Ring pillars — solid metal hoops ───────────────────────────────────
  const ringMat=new THREE.MeshStandardMaterial({color:0xdd2211,emissive:0xe50914,emissiveIntensity:.35,roughness:.3,metalness:.9});
  applyPBR(ringMat,MP_DIFF,MP_NOR,MP_ROUGH,1);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.35,.035,16,40),ringMat);
    ring.position.set(Math.sin(a)*12,.2+Math.random()*5,-Math.cos(a)*12);ring.rotation.x=Math.PI/2;WS.add(ring);
  }
}

function buildRipples(){
  // ── Expanding lava ripple rings from ground centre ──
  const rings=[];const maxR=24;
  for(let i=0;i<5;i++){
    const geo=new THREE.RingGeometry(.85,1,.0,Math.PI*2,48);
    geo.rotateX(-Math.PI/2);
    const mat=new THREE.MeshBasicMaterial({color:0xff2808,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.y=.06;
    mesh.userData.r=(i/5)*maxR; // stagger phases
    WS.add(mesh);rings.push(mesh);
  }
  WS.userData.rippleRings=rings;
}

function buildGrassAndCrystals(){
  if(!THREE.GLTFLoader)return;
  const loader=new THREE.GLTFLoader();
  const grassArr=[],crystalArr=[];
  WS.userData.grassInstances=grassArr;
  WS.userData.crystalInstances=crystalArr;

  function det(seed){let s=seed;return()=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s);};}

  // ── Alien flowers (Three.js Flower.glb) — keep original PBR textures ──
  const FLOWER='https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/models/gltf/Flower/Flower.glb';
  loader.load(FLOWER,gltf=>{
    const tmpl=gltf.scene;
    // Preserve original material colours/textures — only add a tiny emissive warmth
    tmpl.traverse(n=>{if(n.isMesh&&n.material){
      n.material=n.material.clone();
      // Keep n.material.color exactly as baked in the GLB
      if(n.material.emissive){n.material.emissive.setHex(0x110004);}
      n.material.emissiveIntensity=.12;   // very subtle, just to make it glow at night
    }});
    const cnt=isMobile?22:44;
    for(let i=0;i<cnt;i++){
      const r=det(i*251.3+13);
      // Placed OUTSIDE the camera orbit (radius 16) — behind the viewer's perspective
      const ang=r()*Math.PI*2,dist=17+r()*22,sc=0.7+r()*1.1;
      const inst=tmpl.clone(true);
      inst.scale.set(sc,sc*(.8+r()*.5),sc);
      inst.position.set(Math.sin(ang)*dist,0,Math.cos(ang)*dist);
      inst.rotation.y=r()*Math.PI*2;
      inst.userData={swayOff:r()*Math.PI*2,swaySpd:.35+r()*.3,swayAmp:.06+r()*.09};
      WS.add(inst);grassArr.push(inst);
    }
  },undefined,()=>{
    // Fallback: realistic grass blade stand-ins (earthy green-brown tones)
    const cnt=isMobile?22:44;
    for(let i=0;i<cnt;i++){
      const r=det(i*251.3+13);
      const ang=r()*Math.PI*2,dist=17+r()*22,h=0.5+r()*.8;
      const col=new THREE.Color().setHSL(.28+r()*.06,.45+r()*.25,.22+r()*.12);
      const g=new THREE.Mesh(new THREE.CylinderGeometry(.015,.03,h,5),new THREE.MeshStandardMaterial({color:col,roughness:.95,metalness:.02}));
      g.position.set(Math.sin(ang)*dist,h/2,Math.cos(ang)*dist);
      g.userData={swayOff:r()*Math.PI*2,swaySpd:.35+r()*.3,swayAmp:.08+r()*.1};
      WS.add(g);grassArr.push(g);
    }
  });

  // ── Crystal clusters (CC0 from ToxSam/cc0-models-Polygonal-Mind) ──
  const CRYSTAL='https://raw.githubusercontent.com/ToxSam/cc0-models-Polygonal-Mind/main/projects/crystal-crossroads/Crystal_Cluster.glb';
  const CRYSTAL2='https://raw.githubusercontent.com/ToxSam/cc0-models-Polygonal-Mind/main/projects/crystal-crossroads/Crystal_Small_01.glb';

  function placeCrystal(tmpl,cnt,rngSeed,distMin,distMax,scMin,scMax){
    for(let i=0;i<cnt;i++){
      const r=det(rngSeed+i*317.5);
      const ang=r()*Math.PI*2,dist=distMin+r()*distMax,sc=scMin+r()*(scMax-scMin);
      const inst=tmpl.clone(true);
      inst.scale.set(sc,sc*(.7+r()*.6),sc);
      inst.position.set(Math.sin(ang)*dist,0,Math.cos(ang)*dist);
      inst.rotation.y=r()*Math.PI*2;
      inst.userData={spinSpd:(r()-.5)*.006,glowOff:r()*Math.PI*2};
      WS.add(inst);crystalArr.push(inst);
    }
  }

  // Preserve original GLB crystal textures/colours — only overlay a gentle emissive glow
  function applyAlienCrystalMat(tmpl){
    tmpl.traverse(n=>{if(n.isMesh&&n.material){
      n.material=n.material.clone();
      // DO NOT override color, roughness, metalness, or texture maps
      // Only add a very mild emissive so they glow in the dark environment
      if(!n.material.emissive) n.material.emissive=new THREE.Color(0);
      n.material.emissive.setScalar(0.04);  // near-black warmth — barely visible tint
      n.material.emissiveIntensity=.55;     // pulsed per-frame in animLoop
    }});
  }

  loader.load(CRYSTAL,gltf=>{
    applyAlienCrystalMat(gltf.scene);
    // Large clusters scattered OUTSIDE the camera ring (17–38m) — visible as backdrop
    placeCrystal(gltf.scene,isMobile?8:16,77,17,22,.45,1.1);
  },undefined,()=>{
    // Fallback emissive octahedra — neutral tones, placed behind camera
    const cnt=isMobile?8:16;
    for(let i=0;i<cnt;i++){
      const r=det(77+i*317.5);
      const ang=r()*Math.PI*2,dist=17+r()*22,sc=.4+r()*.65;
      const m=new THREE.Mesh(new THREE.OctahedronGeometry(sc,0),new THREE.MeshStandardMaterial({color:0xaaaacc,emissive:0x333366,emissiveIntensity:.55,roughness:.12,metalness:.7,transparent:true,opacity:.9}));
      m.position.set(Math.sin(ang)*dist,sc*.5,Math.cos(ang)*dist);
      m.userData={spinSpd:(r()-.5)*.006,glowOff:r()*Math.PI*2};
      WS.add(m);crystalArr.push(m);
    }
  });

  loader.load(CRYSTAL2,gltf=>{
    applyAlienCrystalMat(gltf.scene);
    // Small crystals — mix of mid-field (near panels) and background
    placeCrystal(gltf.scene,isMobile?12:24,199,14,26,.2,.55);
  },undefined,()=>{});
}

function buildProfileAvatar(){

  const ctx=cv.getContext('2d');

  function buildAvatar(imgSrc){
    if(imgSrc){
      // Clip to circle — no crossOrigin needed for local file
      ctx.save();
      ctx.beginPath();ctx.arc(S/2,S/2,S/2-4,0,Math.PI*2);ctx.clip();
      ctx.drawImage(imgSrc,0,0,S,S);
      ctx.restore();
      // Thin dark edge only (no heavy vignette — keeps photo bright & clear)
      const edge=ctx.createRadialGradient(S/2,S/2,S*.38,S/2,S/2,S/2);
      edge.addColorStop(0,'transparent');edge.addColorStop(1,'rgba(0,0,0,.18)');
      ctx.fillStyle=edge;ctx.beginPath();ctx.arc(S/2,S/2,S/2,0,Math.PI*2);ctx.fill();
    }else{

    // Name label — high-res 1024×128 canvas
    const nc=document.createElement('canvas');nc.width=1024;nc.height=128;

    nctx.shadowBlur=0;
    nctx.font='500 26px "Outfit",Arial,sans-serif';
    nctx.fillStyle='rgba(229,9,20,.9)';
    nctx.fillText('AI  ·  ML  ·  PORTFOLIO  2026',512,116);
    const nameTex=new THREE.CanvasTexture(nc);
    nameTex.anisotropy=WR.capabilities.getMaxAnisotropy();
    const nameMesh=new THREE.Mesh(
      new THREE.PlaneGeometry(2.8,.35),
      new THREE.MeshBasicMaterial({map:nameTex,transparent:true,depthWrite:false,fog:false})
    );
    nameMesh.position.set(0,4.3,0);WS.add(nameMesh);WS.userData.nameMesh=nameMesh;
    const pl=new THREE.PointLight(0xe50914,1.8,10);pl.position.set(0,5.8,.4);WS.add(pl);
  }

  const img=new Image(); // no crossOrigin — local file is same-origin

function bindControls(){
  const cv=document.getElementById('world-canvas');
  // Mouse drag
  cv.addEventListener('mousedown',e=>{if(e.target!==cv)return;isDragging=true;dLastX=e.clientX;dLastY=e.clientY;autoOrbit=false;});
  document.addEventListener('mouseup',()=>isDragging=false);
  document.addEventListener('mousemove',e=>{
    if(isDragging){camYaw-=e.movementX*.0025;camPitch-=e.movementY*.002;camPitch=Math.max(-Math.PI/2.1,Math.min(Math.PI/2.1,camPitch));}
    // Hover tooltip
    const r=cv.getBoundingClientRect();
    const nmx=((e.clientX-r.left)/r.width)*2-1,nmy=-((e.clientY-r.top)/r.height)*2+1;
    doRaycast(nmx,nmy);
  });
  // Touch drag (look around)
  let lastTX=0,lastTY=0,lastDist=0;
  cv.addEventListener('touchstart',e=>{lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;if(e.touches.length===2)lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);autoOrbit=false;},{passive:true});
  cv.addEventListener('touchmove',e=>{
    if(e.touches.length===1){camYaw-=(e.touches[0].clientX-lastTX)*.003;camPitch-=(e.touches[0].clientY-lastTY)*.002;camPitch=Math.max(-Math.PI/2.1,Math.min(Math.PI/2.1,camPitch));lastTX=e.touches[0].clientX;lastTY=e.touches[0].clientY;}
  },{passive:true});
  // Click on panels
  cv.addEventListener('click',e=>{
    if(Math.abs(e.movementX||0)>5||Math.abs(e.movementY||0)>5)return;
    const r=cv.getBoundingClientRect();
    const nmx=((e.clientX-r.left)/r.width)*2-1,nmy=-((e.clientY-r.top)/r.height)*2+1;
    const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(nmx,nmy),WC);
    const hits=ray.intersectObjects(panelMeshes);
    if(hits.length)flyToPanel(hits[0].object);else{autoOrbit=!autoOrbit;}
  });
  // Tap on panels (touch)
  cv.addEventListener('touchend',e=>{
    if(e.changedTouches.length!==1)return;
    const t=e.changedTouches[0];
    const r=cv.getBoundingClientRect();
    const nmx=((t.clientX-r.left)/r.width)*2-1,nmy=-((t.clientY-r.top)/r.height)*2+1;
    const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(nmx,nmy),WC);
    const hits=ray.intersectObjects(panelMeshes);
    if(hits.length)flyToPanel(hits[0].object);
  },{passive:true});
  // Keys
  document.addEventListener('keydown',e=>{
    if(e.code==='KeyW')keys.w=true;if(e.code==='KeyA')keys.a=true;
    if(e.code==='KeyS')keys.s=true;if(e.code==='KeyD')keys.d=true;
    if(e.key==='Escape')closeContent();if(e.code==='Space'){autoOrbit=!autoOrbit;}
    if(e.code==='KeyW'||e.code==='KeyA'||e.code==='KeyS'||e.code==='KeyD')autoOrbit=false;
  });
  document.addEventListener('keyup',e=>{if(e.code==='KeyW')keys.w=false;if(e.code==='KeyA')keys.a=false;if(e.code==='KeyS')keys.s=false;if(e.code==='KeyD')keys.d=false;});
  // Virtual Joystick
  const jz=document.getElementById('joystick-zone'),jt=document.getElementById('joystick-thumb');
  if(jz){
    let startX=0,startY=0;
    jz.addEventListener('touchstart',e=>{jActive=true;startX=e.touches[0].clientX;startY=e.touches[0].clientY;autoOrbit=false;e.stopPropagation();},{passive:true});
    jz.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      const dist=Math.sqrt(dx*dx+dy*dy),maxR=32;
      jX=Math.max(-1,Math.min(1,dx/maxR));jY=Math.max(-1,Math.min(1,dy/maxR));
      jt.style.transform=`translate(${jX*maxR}px,${jY*maxR}px)`;e.stopPropagation();
    },{passive:true});
    jz.addEventListener('touchend',()=>{jActive=false;jX=0;jY=0;jt.style.transform='';});
  }
  window.addEventListener('resize',()=>{WR.setSize(innerWidth,innerHeight);WC.aspect=innerWidth/innerHeight;WC.updateProjectionMatrix();});
}

function doRaycast(nmx,nmy){
  const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(nmx,nmy),WC);
  const hits=ray.intersectObjects(panelMeshes);
  const tt=document.getElementById('hud-tooltip');
  hoveredPanel=hits.length?hits[0].object:null;
  tt.textContent=hoveredPanel?hoveredPanel.userData.sec.title:'';
  tt.style.opacity=hoveredPanel?'1':'0';
}

// ══════════════════════════════════════════════════════
// FLY TO PANEL
// ══════════════════════════════════════════════════════
function flyToPanel(panel){
  if(isFlying)return;
  focusedPanel=panel;autoOrbit=false;
  const pPos=panel.position.clone();
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(panel.quaternion);
  const target=pPos.clone().addScaledVector(dir,5.8);target.y=Math.max(target.y,1.2);
  flyFP.copy(WC.position);flyTP.copy(target);
  const tc=WC.clone();tc.position.copy(target);tc.lookAt(pPos);
  flyFQ.copy(WC.quaternion);flyTQ.copy(tc.quaternion);
  flyT=0;isFlying=true;
}

// ══════════════════════════════════════════════════════
// ANIMATION LOOP
// ══════════════════════════════════════════════════════
const clk=new THREE.Clock();
const FPS_CAP=60,FRAME_MS=1000/FPS_CAP;
let _lastFrameNow=0;
function animLoop(now){
  requestAnimationFrame(animLoop);
  // Hard 60 FPS cap — skip frame if too soon (saves GPU on 120/144 Hz displays)
  const _delta=now-_lastFrameNow;
  if(_delta<FRAME_MS-0.5)return;
  _lastFrameNow=now-(_delta%FRAME_MS);
  const dt=Math.min(clk.getDelta(),.05),t=clk.getElapsedTime();

  // Flying
  if(isFlying){
    flyT=Math.min(flyT+dt*.85,1);
    const e=flyT<.5?4*flyT*flyT*flyT:1-Math.pow(-2*flyT+2,3)/2;
    WC.position.lerpVectors(flyFP,flyTP,e);
    THREE.Quaternion.slerp(flyFQ,flyTQ,WC.quaternion,e);
    camPos.copy(WC.position);
    if(flyT>=1){isFlying=false;if(focusedPanel)setTimeout(()=>openContent(focusedPanel.userData.sec),120);}
    WR.render(WS,WC);return;
  }

  // Auto orbit
  if(autoOrbit){autoAngle+=dt*.08;const orbitR=16;camPos.set(Math.sin(autoAngle)*orbitR,1.8,Math.cos(autoAngle)*orbitR);camYaw=autoAngle;camPitch=.07+Math.sin(autoAngle*.18)*.035;}

  // WASD
  if(!autoOrbit){
    const spd=4.5*dt;
    const fw=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw));
    const rt=new THREE.Vector3(-Math.cos(camYaw),0,Math.sin(camYaw));
    if(keys.w)camPos.addScaledVector(fw,spd);if(keys.s)camPos.addScaledVector(fw,-spd);
    if(keys.a)camPos.addScaledVector(rt,-spd);if(keys.d)camPos.addScaledVector(rt,spd);
    const hr=Math.sqrt(camPos.x*camPos.x+camPos.z*camPos.z);
    if(hr>22){camPos.x*=22/hr;camPos.z*=22/hr;}
    camPos.y=Math.max(1,Math.min(7,camPos.y));
  }
  // Joystick
  if(jActive&&!autoOrbit){
    const spd=4*dt;
    camPos.x+=(-Math.sin(camYaw)*(-jY)+Math.cos(camYaw)*jX)*spd;
    camPos.z+=(-Math.cos(camYaw)*(-jY)-Math.sin(camYaw)*jX)*spd;
  }

  WC.position.copy(camPos);WC.rotation.set(camPitch,camYaw,0,'YXZ');

  // Panels
  panelMeshes.forEach((p,i)=>{
    p.position.y=p.userData.baseY+Math.sin(t*.55+p.userData.fp)*.16;
    const h=p===hoveredPanel;
    const tgtS=h?1.06:1;p.scale.lerp(new THREE.Vector3(tgtS,tgtS,tgtS),.07);
    const frame=p.children[0];if(frame?.material)frame.material.opacity+=(h?.75:.35-frame.material.opacity)*.1;
    const glow=glowMeshes[i];if(glow)glow.material.opacity+=(h?.07:.0-glow.material.opacity)*.1;
    panelLights[i].intensity+=(h?2.5:.6-panelLights[i].intensity)*.08;
  });

  // Decorations
  const {tk,icoOuter,icoInner,debris,dustPts,dustVel,dustPos,dustCnt,glbModel,
         photoMesh,photoRing,photoRing2,nameMesh,
         skySphere,fissures,rippleRings,grassInstances,crystalInstances}=WS.userData;

  // Existing decorations
  if(tk){tk.rotation.x=t*.007;tk.rotation.y=t*.011;tk.rotation.z=t*.004;}
  if(icoOuter){icoOuter.rotation.x=t*.002;icoOuter.rotation.y=t*.004;}
  if(icoInner){icoInner.rotation.x=-t*.004;icoInner.rotation.y=t*.006;}
  if(debris)debris.forEach(d=>{d.rotation.x+=d.userData.rx;d.rotation.y+=d.userData.ry;d.rotation.z+=d.userData.rz;d.userData.fy+=d.userData.fs;d.position.y=d.userData.by+Math.sin(d.userData.fy)*.4;});
  if(dustPts&&dustPos&&dustVel){for(let i=0;i<dustCnt;i++){dustPos[i*3]+=dustVel[i*3];dustPos[i*3+1]+=dustVel[i*3+1];dustPos[i*3+2]+=dustVel[i*3+2];if(dustPos[i*3+1]>18){dustPos[i*3+1]=0;const a=Math.random()*Math.PI*2,r=4+Math.random()*18;dustPos[i*3]=Math.cos(a)*r;dustPos[i*3+2]=Math.sin(a)*r;}}dustPts.geometry.attributes.position.needsUpdate=true;}
  if(glbModel){glbModel.rotation.y=t*.25;}
  if(photoMesh){photoMesh.lookAt(WC.position);}
  if(photoRing){photoRing.rotation.z=t*.4;photoRing.lookAt(WC.position);}
  if(photoRing2){photoRing2.rotation.z=-t*.3;photoRing2.lookAt(WC.position);}
  if(nameMesh){nameMesh.lookAt(WC.position);}

  // ── New animations ────────────────────────────────────
  // Sky dome very slow drift
  if(skySphere)skySphere.rotation.y=t*.0025;

  // Lava fissure heartbeat pulse
  if(fissures&&fissures.length){
    const pulse=.13+Math.sin(t*.9)*.08+Math.sin(t*2.3)*.03;
    fissures[0].material.opacity=pulse;
    if(fissures[1])fissures[1].material.opacity=pulse*.48;
  }

  // Expanding lava ripple rings from ground
  if(rippleRings){
    const maxR=24,spd=6;
    rippleRings.forEach(ring=>{
      ring.userData.r=(ring.userData.r||0)+spd*dt;
      if(ring.userData.r>maxR)ring.userData.r=0;
      const r=Math.max(.1,ring.userData.r);
      ring.scale.set(r,1,r);
      ring.material.opacity=Math.max(0,(1-r/maxR)*.22);
    });
  }

  // Alien grass / flower sway
  if(grassInstances)grassInstances.forEach(g=>{
    if(!g.userData.swayOff&&g.userData.swayOff!==0)return;
    g.rotation.z=Math.sin(t*g.userData.swaySpd+g.userData.swayOff)*g.userData.swayAmp;
    g.rotation.x=Math.sin(t*g.userData.swaySpd*.65+g.userData.swayOff+1.2)*g.userData.swayAmp*.4;
  });

  // Crystal slow spin + emissive glow breathe
  if(crystalInstances)crystalInstances.forEach(c=>{
    c.rotation.y+=c.userData.spinSpd;
    c.traverse(n=>{if(n.isMesh&&n.material&&n.material.emissiveIntensity!==undefined){
      n.material.emissiveIntensity=.55+Math.sin(t*.7+c.userData.glowOff)*.25;
    }});
  });

  WR.render(WS,WC);
}

// ══════════════════════════════════════════════════════
// CONTENT OVERLAY
// ══════════════════════════════════════════════════════
function openContent(sec){
  document.getElementById('content-section-title').textContent=sec.title;
  document.getElementById('content-body').innerHTML=getContent(sec.id);
  document.getElementById('content-overlay').classList.add('active');
  document.querySelectorAll('#content-body a').forEach(a=>{
    a.addEventListener('mouseenter',()=>hoverCursor(true));
    a.addEventListener('mouseleave',()=>hoverCursor(false));
  });
}

function closeContent(){
  document.getElementById('content-overlay').classList.remove('active');
  focusedPanel=null;
  if(!isFlying){
    flyFP.copy(WC.position);
    const backAngle=autoAngle;
    flyTP.set(Math.sin(backAngle)*13,1.8,Math.cos(backAngle)*13);
    const tc=WC.clone();tc.position.copy(flyTP);tc.rotation.set(.07,backAngle,0,'YXZ');
    flyFQ.copy(WC.quaternion);flyTQ.copy(tc.quaternion);
    flyT=0;isFlying=true;
    setTimeout(()=>{autoOrbit=true;},1500);
  }
}

// ══════════════════════════════════════════════════════
// MOBILE MENU
// ══════════════════════════════════════════════════════
function buildMobileMenu(){
  const grid=document.getElementById('mob-menu-grid');
  if(!grid)return;
  SECTIONS.forEach(sec=>{
    const btn=document.createElement('div');btn.className='mob-sec-btn';
    btn.innerHTML=`<div class="msb-icon">${sec.icon}</div><div class="msb-label">${sec.title}</div>`;
    btn.onclick=()=>{toggleMobMenu();const p=panelMeshes.find(m=>m.userData.sec.id===sec.id);if(p)flyToPanel(p);};
    grid.appendChild(btn);
  });
}
function toggleMobMenu(){const m=document.getElementById('mob-menu');if(m)m.classList.toggle('open');}

// ══════════════════════════════════════════════════════
// TRANSITIONS
// ══════════════════════════════════════════════════════
function enterWorld(){
  const audio=new Audio('./mixkit-mouse-click-close-1113.mp3');audio.play().catch(()=>{});
  const ps=document.getElementById('profiles-screen');
  ps.style.transition='opacity .4s';ps.style.opacity='0';
  setTimeout(()=>{
    ps.classList.remove('show');ps.style.display='none';
    document.getElementById('world-screen').classList.add('show');
    initWorld();autoOrbit=true;
  },400);
}

function backToProfiles(){
  const ws=document.getElementById('world-screen');
  ws.style.transition='opacity .4s';ws.style.opacity='0';
  setTimeout(()=>{
    ws.classList.remove('show');ws.style.opacity='';ws.style.transition='';
    if(WR){WR.dispose();WR=null;}panelMeshes=[];glowMeshes=[];panelLights=[];
    const ps=document.getElementById('profiles-screen');
    ps.style.display='';ps.style.opacity='0';ps.classList.add('show');
    setTimeout(()=>{ps.style.transition='opacity .5s';ps.style.opacity='1';},30);
  },400);
}
</script>
